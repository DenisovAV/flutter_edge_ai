name: Build LiteRT-LM Native — Windows only

# Standalone Windows-only build for fast iteration when iterating on
# patch_c_api.sh / native bumps that only touch the Windows tarball
# (e.g. Intel NPU bundle ABI fixes). Use the full
# `build-litertlm-native.yml` workflow when changing all 3 desktop
# platforms together.
#
# Triggered manually only — never on push. Same Windows job body as the
# build-windows-x86_64 job of build-litertlm-native.yml (keep in sync when
# editing).

on:
  workflow_dispatch:
    inputs:
      litertlm_version:
        description: 'LiteRT-LM ref (tag, branch, or commit SHA)'
        required: true
        default: '95df4c2a932b4917ace66fcfef6c154e8d2a6699'
      prebuilt_ref:
        description: 'Upstream ref to take the prebuilt constraint provider from (blank = the exact v0.20.0 source SHA; Dawn always comes from the source ref)'
        required: false

jobs:
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    # Raised with build-litertlm-native.yml: v0.20.0 builds libLiteRt.dll and
    # the ML Drift WebGPU accelerator from source too (review-windows M7).
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      PREBUILT_REF: ${{ inputs.prebuilt_ref || '7a03724cece417f1724c923b3d527b4319730841' }}
      # The WebGPU accelerator override (5f973f57, LiteRT #11120) is gone: from
      # v0.20.0 the accelerator is built from LiteRT at the tag's pin, which
      # contains #11120 (dp4a off on Intel GPUs).
      ANDROID_NDK_HOME: ''
      BAZEL_OUTPUT_BASE: 'D:\b'
    steps:
      - uses: actions/checkout@v4

      - name: Exclude the Bazel output base from Defender
        # Two consecutive Windows runs died at ~52 minutes with
        #   ERROR: Couldn't delete action output directory:
        #     D:/b/execroot/litert_lm/bazel-out/_tmp/actions/stderr-NNNN (Permission denied)
        # The build itself had finished; what failed was Bazel's cleanup of a
        # per-action stderr file that Defender still held open. Excluding the
        # output base removes the scanner from that path.
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:BAZEL_OUTPUT_BASE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "bazel.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions requested for $env:BAZEL_OUTPUT_BASE"

      - name: Enable symlinks
        run: git config --global core.symlinks true

      - name: Clone LiteRT-LM
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM C:\LiteRT-LM
          cd C:\LiteRT-LM
          git checkout "$env:LITERTLM_VERSION"
          # Companions from a LATER upstream commit than the source: upstream's
          # 2026-08-21 Constraint change (a8a8c445, a41b7c5c) put ComputeMask in
          # the vtable slot ComputeBitmap had, and the prebuilt provider at the
          # v0.17.0/v0.17.1 tags still implements the old one — a tool call
          # segfaults in CompositeLogitMask::Apply. 4453b286 is upstream's own
          # refresh of those binaries. Their wheel compiles the provider in, so
          # their release lane never sees it.
          git lfs pull --include="prebuilt/windows_x86_64/*"
          # One file, from a different commit than the source: fetch it straight
          # from the LFS media endpoint, where the ref is visible in the URL.
          curl.exe -fsSL -o C:\LiteRT-LM\prebuilt\windows_x86_64\libGemmaModelConstraintProvider.dll `
            "https://media.githubusercontent.com/media/google-ai-edge/LiteRT-LM/$env:PREBUILT_REF/prebuilt/windows_x86_64/libGemmaModelConstraintProvider.dll"
          if ($LASTEXITCODE -ne 0) { throw "could not fetch the provider for $env:PREBUILT_REF" }
          $provPath = "C:\LiteRT-LM\prebuilt\windows_x86_64\libGemmaModelConstraintProvider.dll"
          Write-Host "provider: $((Get-Item $provPath).Length) bytes from $env:PREBUILT_REF"
          # Fail before the hour of Bazel, not after it.
          # Absolute paths on purpose: `cd` moves PowerShell's location, not the
          # process working directory, so a .NET call with a relative path reads
          # from the workspace root and fails there instead.
          # Two-sided: a provider older than the runtime segfaults in
          # CompositeLogitMask::Apply, and a newer one against an older runtime
          # does the same — reachable whenever this builds a ref from before
          # upstream's 2026-08-21 Constraint change.
          $want = [bool](Select-String -Path C:\LiteRT-LM\runtime\components\constrained_decoding\constraint.h -Pattern 'ComputeMask' -Quiet)
          $prov = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($provPath))
          $have = $prov.Contains('LogitMask')
          if ($want -ne $have) {
            throw "provider/runtime Constraint ABI mismatch (source ComputeMask=$want, provider LogitMask=$have) - every tool call would segfault"
          }
          Write-Host "provider ABI: source and provider agree (ComputeMask=$want)"

      - name: Patch C API
        shell: bash
        run: bash packages/litertlm_dart/native/litert_lm/patch_c_api.sh C:/LiteRT-LM

      - name: Build LiteRtLm.dll
        # static_link_msvcrt: see build-litertlm-native.yml (#456); it does not
        # reach libLiteRt.dll, which LiteRT builds /MD (decision D8, open).
        # libLiteRt.dll and the WebGPU accelerator are built from LiteRT's
        # source from v0.20.0: upstream's prebuilt/ no longer has them.
        run: |
          cd C:\LiteRT-LM
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build -c opt `
            --linkopt=/OPT:REF --linkopt=/OPT:ICF `
            --build_tag_filters='-nowindows' `
            --features=compiler_param_file `
            --features=archive_param_file `
            --features=static_link_msvcrt `
            --spawn_strategy=local `
            --define=litert_runtime_link_mode=dynamic `
            '//c:libLiteRtLm.dylib' `
            '@litert//litert/c:libLiteRt' `
            '@litert//litert/runtime/accelerators/gpu:libLiteRtWebGpuAccelerator'
          if ($LASTEXITCODE -ne 0) { throw "LiteRtLm.dll / libLiteRt.dll / accelerator build failed (exit $LASTEXITCODE)" }

      - name: Build Intel NPU dispatch
        # Same pin as the runtime — see build-litertlm-native.yml for why the
        # previously carried-forward prebuilt (OpenVino 2026.2.0 against a
        # runtime pinned to 2026.3.0) is what broke backend=npu (#3217).
        run: |
          cd C:\LiteRT-LM
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build -c opt `
            --linkopt=/OPT:REF --linkopt=/OPT:ICF `
            --build_tag_filters='-nowindows' `
            --features=compiler_param_file `
            --features=archive_param_file `
            --spawn_strategy=local `
            --define=litert_runtime_link_mode=dynamic `
            '@litert//litert/vendors/intel_openvino/dispatch:LiteRtDispatch'
          if ($LASTEXITCODE -ne 0) {
            # Retry once: a cleanup-only failure leaves the action cache warm,
            # so the second pass finishes in minutes rather than re-doing an
            # hour of compilation.
            Write-Host "First pass exited $LASTEXITCODE — retrying against the warm cache"
            bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
              build -c opt `
              --linkopt=/OPT:REF --linkopt=/OPT:ICF `
              --build_tag_filters='-nowindows' `
              --features=compiler_param_file `
              --features=archive_param_file `
              --spawn_strategy=local `
              --define=litert_runtime_link_mode=dynamic `
              '@litert//litert/vendors/intel_openvino/dispatch:LiteRtDispatch'
            if ($LASTEXITCODE -ne 0) {
              # Do not lean on PowerShell's implicit $LASTEXITCODE trailer: one
              # appended native command or a $LASTEXITCODE-clearing construct
              # and a failed build goes green with no diff-level signal.
              throw "Intel NPU dispatch build failed twice (exit $LASTEXITCODE)"
            }
          }

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build StreamProxy.dll
        run: |
          cl /LD /Fe:StreamProxy.dll packages\litertlm_dart\native\litert_lm\stream_proxy.c

      - name: Download DirectXShaderCompiler runtime
        run: |
          $dxcVer = 'v1.9.2602'
          $dxcUrl = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$dxcVer/dxc_2026_02_20.zip"
          Invoke-WebRequest -Uri $dxcUrl -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath dxc -Force
          Get-ChildItem -Recurse dxc | Where-Object { $_.Name -in 'dxil.dll','dxcompiler.dll' } | Select-Object FullName, Length

      - name: Collect artifacts
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item C:\LiteRT-LM\bazel-bin\c\libLiteRtLm.dylib artifacts\LiteRtLm.dll
          # The CRT check for #456 runs in its own step after the upload, once
          # every DLL is in artifacts\ (Check DLL imports).
          Copy-Item StreamProxy.dll artifacts\
          $prebuilt = 'C:\LiteRT-LM\prebuilt\windows_x86_64'
          # No `else` used to mean a missing companion shipped silently. With
          # litert_runtime_link_mode=dynamic these are DT_NEEDED-equivalent PE
          # imports of LiteRtLm.dll, so absence is a LoadLibrary failure on the
          # user's machine, not a degraded build. Test-Path is also true for a
          # ~130-byte git-lfs pointer stub, and Windows has no patchelf step to
          # trip over one — so assert size as well. Both names of each are
          # shipped: lib* for the PE imports, prefixless for Native Assets.
          # No GPU sampler on Windows since v0.19.0 (patch_c_api.sh section 20;
          # see build-litertlm-native.yml): neither linked in nor shipped.
          $dll = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes('artifacts\LiteRtLm.dll'))
          if ($dll.Contains('AVTopKWebGpuSampler@lm@litert@@')) {
            throw 'LiteRtLm.dll links the TopK WebGPU sampler (section 20 did not apply)'
          }
          # From v0.20.0 upstream's prebuilt/ holds only the constraint provider
          # and webgpu_dawn.dll (c57b9ae0; cea62fa2 deleted libwebgpu_dawn.dll).
          # libLiteRt.dll and the WebGPU accelerator are ours, built above from
          # LiteRT at the tag's pin. A LiteRT runtime or accelerator back in
          # prebuilt/ means upstream ships one again: decide which copy ships
          # rather than letting this step pick.
          $stale = @(Get-ChildItem -Path $prebuilt -Filter 'libLiteRt*.dll' -ErrorAction SilentlyContinue)
          if ($stale.Count -ne 0) {
            throw "$prebuilt carries $($stale.Name -join ', ') again; this workflow ships the LiteRT runtime and accelerator it builds"
          }
          # Each from its target's own output path, never from the first match
          # of a recursive search: .runfiles mirrors (the accelerator is runtime
          # data of //c:libLiteRtLm.dylib in dynamic mode, 769af92e; .bazelrc
          # enables runfiles on Windows) and the _solib_ link farm hold copies.
          # Any other real copy under bazel-bin must be the same bytes, or two
          # builds of it exist and we would not know which ships (the same
          # concern as the dispatch's unique match below).
          $pickOne = {
            param($name, $dir)
            $want = "C:\LiteRT-LM\bazel-bin\external\litert\litert\$dir\$name"
            if (-not (Test-Path $want)) { throw "$want was not built" }
            $wantFull = (Get-Item $want).FullName
            $wantHash = (Get-FileHash $want -Algorithm SHA256).Hash
            $others = @(Get-ChildItem -Recurse -Filter $name -Path C:\LiteRT-LM\bazel-bin -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\.runfiles\\' -and $_.FullName -notmatch '\\_solib_' -and $_.FullName -ne $wantFull })
            foreach ($o in $others) {
              if ((Get-FileHash $o.FullName -Algorithm SHA256).Hash -ne $wantHash) {
                throw "$($o.FullName) differs from ${want}: two builds of $name under bazel-bin"
              }
              Write-Host "  identical copy of ${name}: $($o.FullName)"
            }
            Write-Host "$name <- $want"
            $want
          }
          $built = @{
            'libLiteRt' = (& $pickOne 'libLiteRt.dll' 'c')
            'libLiteRtWebGpuAccelerator' = (& $pickOne 'libLiteRtWebGpuAccelerator.dll' 'runtime\accelerators\gpu')
            'libGemmaModelConstraintProvider' = "$prebuilt\libGemmaModelConstraintProvider.dll"
          }
          # Both names of each: lib* is what the PE imports name (LiteRtLm.dll
          # imports libLiteRt.dll), the prefixless copy is the Native Assets
          # name (LiteRt.dll is what LiteRtBindings and the preload open).
          foreach ($base in $built.Keys) {
            $src = $built[$base]
            if (-not (Test-Path $src)) {
              throw "companion missing: $src - LiteRtLm.dll imports it"
            }
            $len = (Get-Item $src).Length
            if ($len -lt 100kb) {
              throw "$base.dll is $len bytes - git-lfs pointer, not a DLL"
            }
            Copy-Item $src "artifacts\$base.dll"
            $stripped = $base -replace '^lib',''
            Copy-Item $src "artifacts\$stripped.dll"
          }
          # Dawn under its one name: the accelerator's import of it is a
          # delay-load of webgpu_dawn.dll through a stub import library
          # (runtime/components/BUILD webgpu_dawn_shared_lib). That stub is a
          # DLL of the same name in bazel-bin (runtime\components\stub\), with
          # empty functions: never take Dawn from bazel-bin, and assert that
          # what ships is the prebuilt byte for byte.
          $dawnSrc = "$prebuilt\webgpu_dawn.dll"
          if (-not (Test-Path $dawnSrc)) { throw "prebuilt webgpu_dawn.dll missing under $prebuilt" }
          if ((Get-Item $dawnSrc).Length -lt 1mb) {
            throw "webgpu_dawn.dll is $((Get-Item $dawnSrc).Length) bytes - a git-lfs pointer or the stub, not Dawn"
          }
          Copy-Item $dawnSrc artifacts\webgpu_dawn.dll
          if ((Get-FileHash artifacts\webgpu_dawn.dll).Hash -ne (Get-FileHash $dawnSrc).Hash) {
            throw "artifacts\webgpu_dawn.dll is not upstream's prebuilt Dawn"
          }
          # Same ABI assert as the Linux jobs: a provider from before upstream's
          # ComputeMask change segfaults on the first tool call and nothing else
          # in this build would notice.
          $want = [bool](Select-String -Path C:\LiteRT-LM\runtime\components\constrained_decoding\constraint.h -Pattern 'ComputeMask' -Quiet)
          $have = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("artifacts\libGemmaModelConstraintProvider.dll")).Contains('LogitMask')
          if ($want -ne $have) {
            throw "provider/runtime Constraint ABI mismatch in the shipped artifact (source ComputeMask=$want, provider LogitMask=$have)"
          }
          Write-Host "provider ABI: shipped artifact agrees with this source (ComputeMask=$want)"
          foreach ($dxc in 'dxil.dll', 'dxcompiler.dll') {
            $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $src) {
              $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Select-Object -First 1
            }
            if ($src) {
              Copy-Item $src.FullName "artifacts\$dxc"
            } else {
              throw "DXC runtime missing: $dxc"
            }
          }
          $outputBase = $env:BAZEL_OUTPUT_BASE
          # Assert the match is unique. The bazel-bin layout is unstable across
          # Bazel versions and configurations; -First 1 over a recursive search
          # silently ships whichever the filesystem enumerated first.
          # Runfiles trees are excluded: they only mirror real outputs, and from
          # LiteRT-LM v0.17.0 the dispatch target carries one, which put two
          # mirrors of the same DLL beside the real one and tripped this check.
          $dispatchAll = @(Get-ChildItem -Recurse -Filter 'LiteRtDispatch.dll' `
            -Path C:\LiteRT-LM\bazel-bin -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\.runfiles\\' })
          if ($dispatchAll.Count -eq 0) { throw "LiteRtDispatch.dll not produced — NPU would ship broken" }
          if ($dispatchAll.Count -ne 1) {
            throw "expected exactly 1 LiteRtDispatch.dll, found $($dispatchAll.Count): $($dispatchAll.FullName -join ', ')"
          }
          $dispatch = $dispatchAll[0]
          Copy-Item $dispatch.FullName "artifacts\LiteRtDispatch.dll"
          # openvino.bzl takes the SDK from OPENVINO_NATIVE_DIR when it is set
          # (local_path_env), past patches/litert_openvino_2026_4_1.patch: a
          # runner with it set would ship whatever that directory holds.
          if ($env:OPENVINO_NATIVE_DIR) {
            throw "OPENVINO_NATIVE_DIR is set ($env:OPENVINO_NATIVE_DIR): the OpenVino SDK would bypass the pinned release"
          }
          $ovRootAll = @(Get-ChildItem -Directory -Path "$outputBase\external" `
            -Filter '*intel_openvino*' -ErrorAction SilentlyContinue)
          if ($ovRootAll.Count -eq 0) { throw "OpenVino SDK not fetched — cannot ship a matched NPU stack" }
          if ($ovRootAll.Count -ne 1) {
            # bzlmod can produce both `intel_openvino` and a decorated
            # `+_repo_rules+intel_openvino~`; picking the wrong one reintroduces
            # the version skew this whole step exists to close.
            throw "expected exactly 1 intel_openvino repo, found $($ovRootAll.Count): $($ovRootAll.Name -join ', ')"
          }
          $ovRoot = $ovRootAll[0]
          # Explicit allow-list, mirroring the set that worked on native-v0.14.0
          # plus the NPU compiler pair that 2026.3.0 adds. A blanket copy of
          # runtime\bin drags in the CPU/GPU/auto/hetero plugins, every model
          # frontend, and a full parallel set of debug builds (openvinod.dll,
          # *_plugind.dll, *_frontendd.dll) — and two near-identically named
          # sets next to each other is exactly how the OpenVino core can bind
          # the wrong plugin. TBB lives outside runtime\bin (3rdparty\tbb\bin),
          # so the search covers the whole SDK.
          $ovWanted = @(
            'openvino.dll',
            'openvino_intel_npu_plugin.dll',
            'openvino_intel_npu_compiler.dll',
            'openvino_intel_npu_compiler_loader.dll',
            # 2026.4: the NPU plugin loads it by name, at run time, for blobs
            # that run on Intel's NPU VM runtime. Gemma 4 E2B and Intel's 12B
            # for Panther Lake load without it (LNL + PTL, 2026-10-20); it
            # ships because Intel's own kit does. intelNpuLibs (npu_stacks.dart)
            # names it too, or it would never reach the app.
            'openvino_intel_npu_vm_runtime.dll',
            'openvino_tensorflow_lite_frontend.dll'
          )
          # Release TBB only: the '*_debug.dll' variants are a full parallel set
          # whose presence beside the release DLLs is the same mis-binding hazard
          # the allow-list above exists to avoid, and the hook was registering
          # them into user apps.
          #
          # Exclude Debug\ by PATH as well, because the name filter cannot see
          # it: TBB uses a '_debug' suffix, but openvino_intel_npu_compiler.dll
          # and openvino_intel_npu_compiler_loader.dll ship under Debug\ AND
          # Release\ with IDENTICAL basenames (781,576 vs 781,584 bytes). With
          # an unordered -Recurse, `Copy-Item -Force` is then last-writer-wins,
          # and no version check can separate them — same SDK, same build
          # string. #3217 was precisely "the Intel OV compiler plugin talking to
          # the wrong libopenvino_intel_npu_compiler", so this is the pairing
          # the assertion below claims to protect.
          $ovDlls = Get-ChildItem -Recurse -Filter '*.dll' -Path $ovRoot.FullName |
            Where-Object {
              ($ovWanted -contains $_.Name -or $_.Name -like 'tbb*') -and
              $_.Name -notlike '*_debug.dll' -and
              $_.FullName -notmatch '\\Debug\\'
            }
          if (-not $ovDlls) { throw "OpenVino runtime DLLs not found under $($ovRoot.FullName)" }
          foreach ($d in $ovDlls) { Copy-Item $d.FullName "artifacts\$($d.Name)" -Force }
          foreach ($w in $ovWanted) {
            if (-not (Test-Path "artifacts\$w")) { throw "OpenVino component missing: $w" }
          }
          # TBB was matched by wildcard and never asserted: if the search found
          # zero of them, $ovDlls is still non-empty (the five openvino* matched),
          # the earlier throw does not fire, and the bundle ships without the
          # library openvino.dll imports. An absent dependency presents exactly
          # like the version mismatch that cost us #3217.
          $tbb = @($ovDlls | Where-Object { $_.Name -like 'tbb*' })
          if ($tbb.Count -eq 0) {
            throw "no TBB DLLs under $($ovRoot.FullName) - openvino.dll imports tbb12; NPU would ship broken"
          }
          if ($tbb.Name -notcontains 'tbb12.dll') {
            throw "tbb12.dll specifically is missing (found: $($tbb.Name -join ', '))"
          }
          # The dispatch links against the SDK Bazel fetched, and the runtime
          # DLLs above are copied out of that same tree, so the pair matches by
          # construction. This asserts that construction rather than trusting
          # it: a future edit that stages either side from somewhere else fails
          # here instead of shipping a bundle whose halves disagree. Carrying a
          # stale pair forward is what cost us #3217 - we shipped OpenVino
          # 2026.2.0 against a pin requiring 2026.3.0, and it read as an
          # upstream regression until the bundle was rebuilt from the pin.
          # Every unreadable input throws: no data is a failure, not a pass.
          #
          # NOT covered: LiteRtDispatch.dll embeds no version string, so the
          # dispatch half of the pair is still only verified by an on-device
          # NPU run.
          $versionTxt = Join-Path $ovRoot.FullName 'openvino\runtime\version.txt'
          if (-not (Test-Path $versionTxt)) {
            throw "OpenVino SDK has no runtime\version.txt at $versionTxt - cannot verify the shipped runtime matches the SDK the dispatch was built against"
          }
          $sdkBuild = (Get-Content $versionTxt -Raw).Trim()
          $buildPattern = '20\d\d\.\d+\.\d+-\d+-[0-9a-fA-F]{7,40}[-/\w]*'
          # Check the SDK's own string against the pattern first. A shape this
          # does not recognise - an unreleased format, or the '<triple>-000--'
          # a git-less OpenVino rebuild produces - would otherwise surface as
          # "no build string in openvino.dll", blaming the DLL for a file whose
          # contents it matches exactly.
          if ($sdkBuild -notmatch "^$buildPattern$") {
            throw "runtime\version.txt is not a build string this check understands: '$sdkBuild' - widen the pattern rather than skipping the comparison"
          }
          $ovDllPath = (Resolve-Path 'artifacts\openvino.dll').Path
          $ovText = [System.Text.Encoding]::ASCII.GetString(
            [System.IO.File]::ReadAllBytes($ovDllPath))
          $embedded = @([regex]::Matches($ovText, $buildPattern) |
            ForEach-Object { $_.Value } | Sort-Object -Unique)
          if ($embedded.Count -eq 0) {
            throw "no build string embedded in the staged openvino.dll - cannot verify it matches the SDK ($sdkBuild)"
          }
          # Exactly one, and it must BE the SDK build — not merely be among the
          # matches. A DLL carrying both the right string and a stale one would
          # satisfy -notcontains while being exactly the mismatch this checks
          # for. Today's openvino.dll embeds precisely one, so requiring one is
          # not a tightening in practice, only in principle.
          #
          # Compare the release (version + build number), not the whole string.
          # Intel's own 2026.3.1 archive — the v0.18.0 pin — disagrees with
          # itself: runtime\version.txt says 2026.3.1-22476-56d9685302d while
          # openvino.dll embeds 2026.3.1-22476-759c5a6ab8c (checked on the
          # official zip). The commit hash is not stable across Intel's
          # packaging; version and build number identify the release.
          $releaseOf = { param($s) if ($s -match '^(\d+\.\d+\.\d+-\d+)-') { $Matches[1] } else { $null } }
          $sdkRelease = & $releaseOf $sdkBuild
          $dllRelease = if ($embedded.Count -eq 1) { & $releaseOf $embedded[0] } else { $null }
          if (-not $sdkRelease -or $dllRelease -ne $sdkRelease) {
            throw "shipped openvino.dll reports '$($embedded -join ', ')' but the dispatch was built against '$sdkBuild'"
          }
          # The checks above prove the SDK agrees with itself; this is the release
          # patches/litert_openvino_2026_4_1.patch pins (npu_build_consistency_test.dart
          # holds the two equal).
          $ovRelease = '2026.4.1-22982'
          if ($sdkRelease -ne $ovRelease) {
            throw "the OpenVino SDK Bazel fetched is $sdkRelease; the pin's patch says $ovRelease"
          }
          # The property all of this protects is "every shipped OpenVino/TBB DLL
          # is the file from the SDK the dispatch linked against". Assert that
          # directly, byte for byte, so it does not hinge on Intel's strings.
          # Two SDK files sharing a basename (the Debug\ trap above) fail here
          # too: only one of them can match the copy that won.
          foreach ($d in $ovDlls) {
            $shippedHash = (Get-FileHash "artifacts\$($d.Name)" -Algorithm SHA256).Hash
            $sdkHash = (Get-FileHash $d.FullName -Algorithm SHA256).Hash
            if ($shippedHash -ne $sdkHash) {
              throw "artifacts\$($d.Name) is not the SDK's $($d.FullName) (sha256 $shippedHash vs $sdkHash)"
            }
          }
          # Upstream's openvino.bzl fetches the SDK by URL alone, with no sha256:
          # pin what ships, so an archive Intel re-uploads under the same release
          # fails here instead of changing the bundle. The names are the staged
          # set exactly (a renamed TBB would otherwise stage and never reach the
          # app); npu_build_consistency_test.dart holds them to intelNpuLibs.
          # Update both with $ovRelease.
          $ovSha256 = @{
            'openvino.dll' = 'a4ea3aa9dc4dc5136aa9d2abd94edafa67d7e0798829a0b93e5f289b9ee36892'
            'openvino_intel_npu_compiler.dll' = 'ac888208cf84081acf6e88edabcc32b56f6b0d5840f1ea6db17d1bd2b7112ce7'
            'openvino_intel_npu_compiler_loader.dll' = '8a6523265e229f53531e68ddbbb631763445c7d61e64284247c9e2940e8c1002'
            'openvino_intel_npu_plugin.dll' = '6155f114669572df0ff6650f216b2c040a8569769dfa1a9888f6d15add08ecb5'
            'openvino_intel_npu_vm_runtime.dll' = '05c9b2d2c7d17bdaec45b37da84ec880a084f9470f87ea6ee9146e4ae25f82b1'
            'openvino_tensorflow_lite_frontend.dll' = 'e35d9dbe1b621d373140ee1cd5635f88ae78a8d89566a0c6790a31d34369b1f8'
            'tbb12.dll' = 'd7603904d45426c05db2d5cb5541aaa861ad36dc481c7fbf3befd11acd596343'
            'tbbbind_2_5.dll' = '9a54a33b5c33866c3846e7b8939609dd08449f9037cff568d92dae88baad01dc'
            'tbbmalloc.dll' = 'ef627edf5b1c19ead180f8fdf027b5800c4ffdfbfcc00d67c7e66df7d62b4f92'
            'tbbmalloc_proxy.dll' = 'eeb7a129d60a9b700cf4236dfc198bf596b391f6151db126749a6fb4bcf819d8'
          }
          $staged = (@($ovDlls.Name | Sort-Object -Unique) -join ', ')
          $pinned = (@($ovSha256.Keys | Sort-Object) -join ', ')
          if ($staged -ne $pinned) {
            throw "staged OpenVino/TBB DLLs [$staged] are not the pinned set [$pinned]"
          }
          foreach ($d in $ovDlls) {
            $h = (Get-FileHash "artifacts\$($d.Name)" -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $ovSha256[$d.Name]) {
              throw "artifacts\$($d.Name) has sha256 $h; $ovRelease pins $($ovSha256[$d.Name])"
            }
          }
          Write-Host "OpenVino release verified: $sdkRelease (version.txt '$sdkBuild', openvino.dll '$($embedded[0])'); $($ovDlls.Count) DLLs byte-identical to the SDK"
          Write-Host "NPU stack: LiteRtDispatch + $($ovDlls.Count) OpenVino/TBB DLLs"
          Get-ChildItem artifacts\

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-windows_x86_64
          path: artifacts/

      # After the upload, so a failing gate still leaves the bundle to read;
      # the publish job needs this job green.
      - name: Check DLL imports (C++ runtime and import closure)
        # Every DLL in the bundle, ours and Intel's: an OpenVINO bump is how a
        # new runtime import would arrive unnoticed. dumpbin /dependents lists
        # normal AND delay-load imports; both count, because from v0.20.0 Dawn
        # is a delay-load (a missing webgpu_dawn.dll then kills the process at
        # the first wgpu call instead of failing LoadLibrary).
        #
        # 1. C++ runtime. The allow-list is what a Flutter Windows app already
        #    ships beside its exe, NOT what the redistributable installs: the
        #    redist also carries vcruntime140_threads.dll, and needing that is
        #    exactly #456. vcomp140 (OpenMP), ucrtbased and the *d debug
        #    runtimes are no Flutter app's either.
        # 2. Import closure: every import is a file of this bundle, a Windows
        #    system DLL (or API set), or an allowed C++ runtime DLL. A name only
        #    the build machine has is a LoadLibrary failure on the user's.
        run: |
          $shipped = @(Get-ChildItem artifacts\*.dll | ForEach-Object { $_.Name })
          $shippedLower = @($shipped | ForEach-Object { $_.ToLower() })
          foreach ($must in @('LiteRtLm.dll', 'LiteRtDispatch.dll', 'StreamProxy.dll',
                              'libLiteRt.dll', 'LiteRt.dll', 'libLiteRtWebGpuAccelerator.dll',
                              'webgpu_dawn.dll', 'libGemmaModelConstraintProvider.dll')) {
            if ($shipped -notcontains $must) { throw "$must is not in artifacts - Collect artifacts should have copied it" }
          }
          $allowedCrt = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $crtPattern = '^(msvcp|vcruntime|concrt|vcomp|msvcr|vccorlib)\d|^ucrtbased\.dll$'
          # TODO(D8, maintainer decision pending): the C++ runtime of the DLLs
          # built from LiteRT's source. libLiteRt.dll is /MD: litert/c/BUILD
          # declares features = ["-static_link_msvcrt"] on the target, which our
          # --features=static_link_msvcrt cannot override; the accelerator gets
          # our /MT. Until D8 is decided this gate REPORTS their runtime imports
          # and lets the allow-list pass them. Then either add libLiteRt.dll,
          # LiteRt.dll and the accelerator here (a LiteRT BUILD patch to /MT,
          # review-windows B1) or keep them allowed and say so in the docs that
          # verify_tarball_manifest.sh holds to the bundle.
          $mustBeStatic = @('LiteRtLm.dll', 'StreamProxy.dll')
          # Windows system DLLs and API sets this bundle may import by name.
          # ze_loader.dll is Intel's Level Zero loader, installed with the
          # Intel GPU/NPU driver (OpenVINO's NPU plugin, loaded only on
          # PreferredBackend.npu).
          $system = @(
            'kernel32.dll', 'kernelbase.dll', 'ntdll.dll', 'user32.dll', 'gdi32.dll',
            'advapi32.dll', 'shell32.dll', 'shlwapi.dll', 'ole32.dll', 'oleaut32.dll',
            'combase.dll', 'ws2_32.dll', 'mswsock.dll', 'iphlpapi.dll', 'bcrypt.dll',
            'bcryptprimitives.dll', 'crypt32.dll', 'secur32.dll', 'rpcrt4.dll',
            'dbghelp.dll', 'version.dll', 'setupapi.dll', 'cfgmgr32.dll', 'psapi.dll',
            'powrprof.dll', 'winmm.dll', 'comctl32.dll', 'ucrtbase.dll',
            'd3d11.dll', 'd3d12.dll', 'dxgi.dll', 'dxcore.dll', 'd3dcompiler_47.dll',
            'opengl32.dll', 'ze_loader.dll'
          )
          $systemPattern = '^(api-ms-win-|ext-ms-win-)'
          $failures = @()
          $dawnImporters = @()
          foreach ($dll in $shipped) {
            $out = dumpbin /dependents "artifacts\$dll"
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed on ${dll}:`n$($out -join "`n")" }
            $section = $null
            $imports = @()
            $delay = @()
            foreach ($line in $out) {
              if ($line -match 'Image has the following delay load dependencies') { $section = 'delay'; continue }
              if ($line -match 'Image has the following dependencies') { $section = 'import'; continue }
              if ($line -match '^\s+Summary\s*$') { $section = $null; continue }
              if ($section -and $line -match '^\s+(\S+\.dll)\s*$') {
                if ($section -eq 'delay') { $delay += $Matches[1].ToLower() } else { $imports += $Matches[1].ToLower() }
              }
            }
            # A parse that found nothing reads as "imports nothing", which is
            # the answer this check exists to distrust.
            if ($imports -notcontains 'kernel32.dll') {
              throw "dumpbin listed no KERNEL32.dll import for ${dll}:`n$($out -join "`n")"
            }
            $all = @($imports + $delay | Sort-Object -Unique)
            $crt = @($all | Where-Object { $_ -match $crtPattern })
            Write-Host "${dll}: imports [$($imports -join ', ')]"
            Write-Host "    delay-load [$(if ($delay.Count) { $delay -join ', ' } else { 'none' })]; C++ runtime [$(if ($crt.Count) { $crt -join ', ' } else { 'none' })]"
            if ($all -contains 'webgpu_dawn.dll') {
              $dawnImporters += "$dll ($(if ($delay -contains 'webgpu_dawn.dll') { 'delay-load' } else { 'import' }))"
            }
            if ($mustBeStatic -contains $dll -and $crt.Count -gt 0) {
              $failures += "$dll imports the VC++ runtime: $($crt -join ', ') - static_link_msvcrt did not apply"
            }
            $badCrt = @($crt | Where-Object { $allowedCrt -notcontains $_ })
            if ($badCrt.Count -gt 0) {
              $failures += "$dll imports a C++ runtime a Flutter Windows app does not ship: $($badCrt -join ', ')"
            }
            foreach ($i in $all) {
              if ($shippedLower -contains $i) { continue }
              if ($system -contains $i -or $i -match $systemPattern) { continue }
              if ($allowedCrt -contains $i) { continue }
              $failures += "$dll imports $i, which is neither in the bundle nor a Windows system DLL"
            }
          }
          Write-Host "webgpu_dawn.dll imported by: $(if ($dawnImporters.Count) { $dawnImporters -join ', ' } else { 'nothing (it is loaded only by name at run time)' })"
          if ($failures.Count -gt 0) {
            throw "DLL import check failed:`n$($failures -join "`n")"
          }

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Load the bundle in a plain Dart program
        # tool/plain_dart_check against these artifacts (the hook takes a
        # populated native\litert_lm\prebuilt\windows_x86_64\ before any
        # download): LiteRt.dll, the accelerator, Dawn, the shader compiler and
        # LiteRtLm.dll preloaded the way the client loads them, and an engine
        # create that gets as far as the missing model. The runner has the VC++
        # redistributable installed, so this does not prove the CRT question
        # above; it proves every normal import resolves. No GPU on the runner.
        run: |
          $dest = 'packages\litertlm_dart\native\litert_lm\prebuilt\windows_x86_64'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item artifacts\* $dest
          cd packages\litertlm_dart\tool\plain_dart_check
          dart pub get
          if ($LASTEXITCODE -ne 0) { throw "dart pub get failed" }
          dart run bin/plain_dart_check.dart
          if ($LASTEXITCODE -ne 0) { throw "plain_dart_check failed (exit $LASTEXITCODE)" }
