          for f in artifacts/*.so; do patchelf --set-rpath '$ORIGIN' "$f"; done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-linux_arm64
          path: artifacts/

  build-windows-x86_64:
    name: Windows x86_64
    if: ${{ !inputs.qualcomm_dispatch_linux_only }}
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      PREBUILT_REF: ${{ inputs.prebuilt_ref || 'b2f686e2ed4718fb84ec398a61dd59ca0f0aff27' }}
      ANDROID_NDK_HOME: ''
      BAZEL_OUTPUT_BASE: 'D:\b'
    steps:
      - uses: actions/checkout@v4

      - name: Exclude the Bazel output base from Defender
        # Two consecutive Windows runs died at ~52 minutes with
        #   ERROR: Couldn't delete action output directory:
        #     D:/b/execroot/litert_lm/bazel-out/_tmp/actions/stderr-NNNN (Permission denied)
        # The build itself had finished; what failed was Bazel's cleanup of a
        # per-action stderr file that Defender still held open. Excluding the
        # output base removes the scanner from that path.
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:BAZEL_OUTPUT_BASE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "bazel.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions requested for $env:BAZEL_OUTPUT_BASE"

      - name: Enable symlinks
        run: git config --global core.symlinks true

      - name: Clone LiteRT-LM
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM C:\LiteRT-LM
          cd C:\LiteRT-LM
          git checkout "$env:LITERTLM_VERSION"
          # Companions from a LATER upstream commit than the source: upstream's
          # 2026-08-21 Constraint change (a8a8c445, a41b7c5c) put ComputeMask in
          # the vtable slot ComputeBitmap had, and the prebuilt provider at the
          # v0.17.0/v0.17.1 tags still implements the old one — a tool call
          # segfaults in CompositeLogitMask::Apply. 4453b286 is upstream's own
          # refresh of those binaries. Their wheel compiles the provider in, so
          # their release lane never sees it.
          git lfs pull --include="prebuilt/windows_x86_64/*"
          # One file, from a different commit than the source: fetch it straight
          # from the LFS media endpoint, where the ref is visible in the URL.
          curl.exe -fsSL -o C:\LiteRT-LM\prebuilt\windows_x86_64\libGemmaModelConstraintProvider.dll `
            "https://media.githubusercontent.com/media/google-ai-edge/LiteRT-LM/$env:PREBUILT_REF/prebuilt/windows_x86_64/libGemmaModelConstraintProvider.dll"
          if ($LASTEXITCODE -ne 0) { throw "could not fetch the provider for $env:PREBUILT_REF" }
          $provPath = "C:\LiteRT-LM\prebuilt\windows_x86_64\libGemmaModelConstraintProvider.dll"
          Write-Host "provider: $((Get-Item $provPath).Length) bytes from $env:PREBUILT_REF"
          # Fail before the hour of Bazel, not after it.
          # Absolute paths on purpose: `cd` moves PowerShell's location, not the
          # process working directory, so a .NET call with a relative path reads
          # from the workspace root and fails there instead.
          # Two-sided: a provider older than the runtime segfaults in
          # CompositeLogitMask::Apply, and a newer one against an older runtime
          # does the same — reachable whenever this builds a ref from before
          # upstream's 2026-08-21 Constraint change.
          $want = [bool](Select-String -Path C:\LiteRT-LM\runtime\components\constrained_decoding\constraint.h -Pattern 'ComputeMask' -Quiet)
          $prov = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($provPath))
          $have = $prov.Contains('LogitMask')
          if ($want -ne $have) {
            throw "provider/runtime Constraint ABI mismatch (source ComputeMask=$want, provider LogitMask=$have) - every tool call would segfault"
          }
          Write-Host "provider ABI: source and provider agree (ComputeMask=$want)"

      - name: Patch C API
        shell: bash
        run: bash packages/flutter_edge_ai_litertlm/native/litert_lm/patch_c_api.sh C:/LiteRT-LM

      - name: Build LiteRtLm.dll
        # litert_runtime_link_mode=dynamic keeps the LiteRt C API OUT of
        # libLiteRtLm so it resolves against the separately shipped libLiteRt at
        # runtime — which is what the prebuilt WebGPU accelerator and the split
        # libwebgpu_dawn expect. Upstream documents it as mandatory
        # for GPU (docs/getting-started/build-and-run.md).
        #
        # It replaces `litert_link_capi_so=true`, which upstream has since
        # removed: that name has zero occurrences in the v0.16.0 tree, so we
        # were passing a define that did nothing and getting a statically
        # linked runtime. Harmless until v0.14.0 split Dawn out of the
        # accelerator; from then on it is what crashes GPU engine_create
        # (#2957) — a clean v0.13.1→v0.14.0 symptom with a downstream cause.
        #
        # resolve_symbols_in_exec=false is gone: LiteRT fd031ae5 (in the v0.18.0
        # pin) deleted the flag and hard-wired the DLL import library it used
        # to select, so passing it would be a silent no-op like the one above.
        #
        # static_link_msvcrt (/MT) makes LiteRtLm.dll carry its own C++ runtime,
        # as Google's companion DLLs and our StreamProxy.dll already do. On the
        # /MD default it imported vcruntime140_threads.dll (C11 threads, VC++
        # 14.38+), which no Flutter app ships and a clean Windows lacks: the
        # Store reviewer's "Failed to preload LiteRtLm.dll" (#456).
        run: |
          cd C:\LiteRT-LM
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build -c opt `
            --linkopt=/OPT:REF --linkopt=/OPT:ICF `
            --build_tag_filters='-nowindows' `
            --features=compiler_param_file `
            --features=archive_param_file `
            --features=static_link_msvcrt `
            --spawn_strategy=local `
            --define=litert_runtime_link_mode=dynamic `
            '//c:libLiteRtLm.dylib'

      - name: Build Intel NPU dispatch
        # Build LiteRtDispatch.dll from the SAME pin as the runtime instead of
        # carrying a prebuilt forward. Ours had been frozen since our own
        # native-v0.11.0-b bundle and shipped OpenVino 2026.2.0, while every
        # LiteRT pin since has required 2026.3.0.dev20260622 — and upstream's
        # own third_party/intel_openvino/openvino.bzl warns that a mismatched
        # pair leaves the Intel OV compiler plugin talking to the wrong
        # libopenvino_intel_npu_compiler at runtime. That is what kills
        # engine_create on backend=npu (our #3217).
        #
        # The OpenVino SDK is fetched by Bazel (configurable_repo), so this
        # needs no preinstalled toolkit on the runner.
        run: |
          cd C:\LiteRT-LM
          bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
            build -c opt `
            --linkopt=/OPT:REF --linkopt=/OPT:ICF `
            --build_tag_filters='-nowindows' `
            --features=compiler_param_file `
            --features=archive_param_file `
            --spawn_strategy=local `
            --define=litert_runtime_link_mode=dynamic `
            '@litert//litert/vendors/intel_openvino/dispatch:LiteRtDispatch'
          if ($LASTEXITCODE -ne 0) {
            # Retry once: a cleanup-only failure leaves the action cache warm,
            # so the second pass finishes in minutes rather than re-doing an
            # hour of compilation.
            Write-Host "First pass exited $LASTEXITCODE — retrying against the warm cache"
            bazel --output_base="$env:BAZEL_OUTPUT_BASE" `
              build -c opt `
              --linkopt=/OPT:REF --linkopt=/OPT:ICF `
              --build_tag_filters='-nowindows' `
              --features=compiler_param_file `
              --features=archive_param_file `
              --spawn_strategy=local `
              --define=litert_runtime_link_mode=dynamic `
              '@litert//litert/vendors/intel_openvino/dispatch:LiteRtDispatch'
            if ($LASTEXITCODE -ne 0) {
              # Do not lean on PowerShell's implicit $LASTEXITCODE trailer: one
              # appended native command or a $LASTEXITCODE-clearing construct
              # and a failed build goes green with no diff-level signal.
              throw "Intel NPU dispatch build failed twice (exit $LASTEXITCODE)"
            }
          }

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build StreamProxy.dll
        run: |
          cl /LD /Fe:StreamProxy.dll packages\flutter_edge_ai_litertlm\native\litert_lm\stream_proxy.c

      - name: Download DirectXShaderCompiler runtime
        # WebGPU/DX12 backend on Windows requires dxil.dll + dxcompiler.dll
        # at runtime to compile compute shaders for the LLM kernels.
        # Sourced from microsoft/DirectXShaderCompiler GitHub releases.
        run: |
          $dxcVer = 'v1.9.2602'
          $dxcUrl = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$dxcVer/dxc_2026_02_20.zip"
          Invoke-WebRequest -Uri $dxcUrl -OutFile dxc.zip
          Expand-Archive -Path dxc.zip -DestinationPath dxc -Force
          Get-ChildItem -Recurse dxc | Where-Object { $_.Name -in 'dxil.dll','dxcompiler.dll' } | Select-Object FullName, Length

      - name: Collect artifacts
        # Ship BOTH naming conventions for Google's prebuilt companion DLLs:
        # - Prefixless (LiteRt.dll) for Native Assets on Windows
        # - Original lib* (libLiteRt.dll) to satisfy LiteRtLm.dll's PE import table
        # Plus DXC runtime DLLs (dxil + dxcompiler) for WebGPU/DX12 GPU init.
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item C:\LiteRT-LM\bazel-bin\c\libLiteRtLm.dylib artifacts\LiteRtLm.dll
          # The CRT check for #456 runs at the END of this step, once every DLL
          # is in artifacts\ — see "the allow-list is what a Flutter Windows
          # app already ships" below.
          Copy-Item StreamProxy.dll artifacts\
          $prebuilt = 'C:\LiteRT-LM\prebuilt\windows_x86_64'
          # No `else` used to mean a missing companion shipped silently. With
          # litert_runtime_link_mode=dynamic these are PE imports of LiteRtLm.dll,
          # so absence is a LoadLibrary failure on the user's machine, not a
          # degraded build. Test-Path is also true for a ~130-byte git-lfs pointer
          # stub, and Windows has no patchelf step to trip over one — assert size.
          foreach ($base in @('libGemmaModelConstraintProvider','libLiteRt','libLiteRtTopKWebGpuSampler','libLiteRtWebGpuAccelerator','libwebgpu_dawn')) {
            $src = "$prebuilt\$base.dll"
            if (-not (Test-Path $src)) {
              throw "prebuilt companion missing: $base.dll - LiteRtLm.dll imports it"
            }
            $len = (Get-Item $src).Length
            if ($len -lt 100kb) {
              throw "$base.dll is $len bytes - git-lfs pointer, not a DLL"
            }
            Copy-Item $src "artifacts\$base.dll"
            $stripped = $base -replace '^lib',''
            Copy-Item $src "artifacts\$stripped.dll"
          }
          # Same ABI assert as the Linux jobs: a provider from before upstream's
          # ComputeMask change segfaults on the first tool call and nothing else
          # in this build would notice.
          $want = [bool](Select-String -Path C:\LiteRT-LM\runtime\components\constrained_decoding\constraint.h -Pattern 'ComputeMask' -Quiet)
          $have = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("artifacts\libGemmaModelConstraintProvider.dll")).Contains('LogitMask')
          if ($want -ne $have) {
            throw "provider/runtime Constraint ABI mismatch in the shipped artifact (source ComputeMask=$want, provider LogitMask=$have)"
          }
          Write-Host "provider ABI: shipped artifact agrees with this source (ComputeMask=$want)"
          # DXC runtime — search recursively because the zip layout puts the
          # x64 binaries in bin\x64\ inside the archive root.
          foreach ($dxc in 'dxil.dll', 'dxcompiler.dll') {
            $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $src) {
              $src = Get-ChildItem -Recurse -Filter $dxc -Path dxc | Select-Object -First 1
            }
            if ($src) {
              Copy-Item $src.FullName "artifacts\$dxc"
            } else {
              throw "DXC runtime missing: $dxc"
            }
          }
          # Intel NPU dispatch, built above from the pinned tree, plus the
          # OpenVino runtime from the SDK Bazel fetched for that same pin.
          # Searched rather than hardcoded: bzlmod decorates external repo
          # directory names, so the path is not stable across Bazel versions.
          $outputBase = $env:BAZEL_OUTPUT_BASE
          # Assert the match is unique. The bazel-bin layout is unstable across
          # Bazel versions and configurations; -First 1 over a recursive search
          # silently ships whichever the filesystem enumerated first.
          # Runfiles trees are excluded: they only mirror real outputs, and from
          # LiteRT-LM v0.17.0 the dispatch target carries one, which put two
          # mirrors of the same DLL beside the real one and tripped this check.
          $dispatchAll = @(Get-ChildItem -Recurse -Filter 'LiteRtDispatch.dll' `
            -Path C:\LiteRT-LM\bazel-bin -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\.runfiles\\' })
          if ($dispatchAll.Count -eq 0) { throw "LiteRtDispatch.dll not produced — NPU would ship broken" }
          if ($dispatchAll.Count -ne 1) {
            throw "expected exactly 1 LiteRtDispatch.dll, found $($dispatchAll.Count): $($dispatchAll.FullName -join ', ')"
          }
          $dispatch = $dispatchAll[0]
          Copy-Item $dispatch.FullName "artifacts\LiteRtDispatch.dll"
          $ovRootAll = @(Get-ChildItem -Directory -Path "$outputBase\external" `
            -Filter '*intel_openvino*' -ErrorAction SilentlyContinue)
          if ($ovRootAll.Count -eq 0) { throw "OpenVino SDK not fetched — cannot ship a matched NPU stack" }
          if ($ovRootAll.Count -ne 1) {
            # bzlmod can produce both `intel_openvino` and a decorated
            # `+_repo_rules+intel_openvino~`; picking the wrong one reintroduces
            # the version skew this whole step exists to close.
            throw "expected exactly 1 intel_openvino repo, found $($ovRootAll.Count): $($ovRootAll.Name -join ', ')"
          }
          $ovRoot = $ovRootAll[0]
          # Explicit allow-list, mirroring the set that worked on native-v0.14.0
          # plus the NPU compiler pair that 2026.3.0 adds. A blanket copy of
          # runtime\bin drags in the CPU/GPU/auto/hetero plugins, every model
          # frontend, and a full parallel set of debug builds (openvinod.dll,
          # *_plugind.dll, *_frontendd.dll) — and two near-identically named
          # sets next to each other is exactly how the OpenVino core can bind
          # the wrong plugin. TBB lives outside runtime\bin (3rdparty\tbb\bin),
          # so the search covers the whole SDK.
          $ovWanted = @(
            'openvino.dll',
            'openvino_intel_npu_plugin.dll',
            'openvino_intel_npu_compiler.dll',
            'openvino_intel_npu_compiler_loader.dll',
            'openvino_tensorflow_lite_frontend.dll'
          )
          # Release TBB only: the '*_debug.dll' variants are a full parallel set
          # whose presence beside the release DLLs is the same mis-binding hazard
          # the allow-list above exists to avoid, and the hook was registering
          # them into user apps.
          #
          # Exclude Debug\ by PATH as well, because the name filter cannot see
          # it: TBB uses a '_debug' suffix, but openvino_intel_npu_compiler.dll
          # and openvino_intel_npu_compiler_loader.dll ship under Debug\ AND
          # Release\ with IDENTICAL basenames (781,576 vs 781,584 bytes). With
          # an unordered -Recurse, `Copy-Item -Force` is then last-writer-wins,
          # and no version check can separate them — same SDK, same build
          # string. #3217 was precisely "the Intel OV compiler plugin talking to
          # the wrong libopenvino_intel_npu_compiler", so this is the pairing
          # the assertion below claims to protect.
          $ovDlls = Get-ChildItem -Recurse -Filter '*.dll' -Path $ovRoot.FullName |
            Where-Object {
              ($ovWanted -contains $_.Name -or $_.Name -like 'tbb*') -and
              $_.Name -notlike '*_debug.dll' -and
              $_.FullName -notmatch '\\Debug\\'
            }
          if (-not $ovDlls) { throw "OpenVino runtime DLLs not found under $($ovRoot.FullName)" }
          foreach ($d in $ovDlls) { Copy-Item $d.FullName "artifacts\$($d.Name)" -Force }
          foreach ($w in $ovWanted) {
            if (-not (Test-Path "artifacts\$w")) { throw "OpenVino component missing: $w" }
          }
          # TBB was matched by wildcard and never asserted: if the search found
          # zero of them, $ovDlls is still non-empty (the five openvino* matched),
          # the earlier throw does not fire, and the bundle ships without the
          # library openvino.dll imports. An absent dependency presents exactly
          # like the version mismatch that cost us #3217.
          $tbb = @($ovDlls | Where-Object { $_.Name -like 'tbb*' })
          if ($tbb.Count -eq 0) {
            throw "no TBB DLLs under $($ovRoot.FullName) - openvino.dll imports tbb12; NPU would ship broken"
          }
          if ($tbb.Name -notcontains 'tbb12.dll') {
            throw "tbb12.dll specifically is missing (found: $($tbb.Name -join ', '))"
          }
          # The dispatch links against the SDK Bazel fetched, and the runtime
          # DLLs above are copied out of that same tree, so the pair matches by
          # construction. This asserts that construction rather than trusting
          # it: a future edit that stages either side from somewhere else fails
          # here instead of shipping a bundle whose halves disagree. Carrying a
          # stale pair forward is what cost us #3217 - we shipped OpenVino
          # 2026.2.0 against a pin requiring 2026.3.0, and it read as an
          # upstream regression until the bundle was rebuilt from the pin.
          # Every unreadable input throws: no data is a failure, not a pass.
          #
          # NOT covered: LiteRtDispatch.dll embeds no version string, so the
          # dispatch half of the pair is still only verified by an on-device
          # NPU run.
          $versionTxt = Join-Path $ovRoot.FullName 'openvino\runtime\version.txt'
          if (-not (Test-Path $versionTxt)) {
            throw "OpenVino SDK has no runtime\version.txt at $versionTxt - cannot verify the shipped runtime matches the SDK the dispatch was built against"
          }
          $sdkBuild = (Get-Content $versionTxt -Raw).Trim()
          $buildPattern = '20\d\d\.\d+\.\d+-\d+-[0-9a-fA-F]{7,40}[-/\w]*'
          # Check the SDK's own string against the pattern first. A shape this
          # does not recognise - an unreleased format, or the '<triple>-000--'
          # a git-less OpenVino rebuild produces - would otherwise surface as
          # "no build string in openvino.dll", blaming the DLL for a file whose
          # contents it matches exactly.
          if ($sdkBuild -notmatch "^$buildPattern$") {
            throw "runtime\version.txt is not a build string this check understands: '$sdkBuild' - widen the pattern rather than skipping the comparison"
          }
          $ovDllPath = (Resolve-Path 'artifacts\openvino.dll').Path
          $ovText = [System.Text.Encoding]::ASCII.GetString(
            [System.IO.File]::ReadAllBytes($ovDllPath))
          $embedded = @([regex]::Matches($ovText, $buildPattern) |
            ForEach-Object { $_.Value } | Sort-Object -Unique)
          if ($embedded.Count -eq 0) {
            throw "no build string embedded in the staged openvino.dll - cannot verify it matches the SDK ($sdkBuild)"
          }
          # Exactly one, and it must BE the SDK build — not merely be among the
          # matches. A DLL carrying both the right string and a stale one would
          # satisfy -notcontains while being exactly the mismatch this checks
          # for. Today's openvino.dll embeds precisely one, so requiring one is
          # not a tightening in practice, only in principle.
          #
          # Compare the release (version + build number), not the whole string.
          # Intel's own 2026.3.1 archive — the v0.18.0 pin — disagrees with
          # itself: runtime\version.txt says 2026.3.1-22476-56d9685302d while
          # openvino.dll embeds 2026.3.1-22476-759c5a6ab8c (checked on the
          # official zip). The commit hash is not stable across Intel's
          # packaging; version and build number identify the release.
          $releaseOf = { param($s) if ($s -match '^(\d+\.\d+\.\d+-\d+)-') { $Matches[1] } else { $null } }
          $sdkRelease = & $releaseOf $sdkBuild
          $dllRelease = if ($embedded.Count -eq 1) { & $releaseOf $embedded[0] } else { $null }
          if (-not $sdkRelease -or $dllRelease -ne $sdkRelease) {
            throw "shipped openvino.dll reports '$($embedded -join ', ')' but the dispatch was built against '$sdkBuild'"
          }
          # The property all of this protects is "every shipped OpenVino/TBB DLL
          # is the file from the SDK the dispatch linked against". Assert that
          # directly, byte for byte, so it does not hinge on Intel's strings.
          # Two SDK files sharing a basename (the Debug\ trap above) fail here
          # too: only one of them can match the copy that won.
          foreach ($d in $ovDlls) {
            $shippedHash = (Get-FileHash "artifacts\$($d.Name)" -Algorithm SHA256).Hash
            $sdkHash = (Get-FileHash $d.FullName -Algorithm SHA256).Hash
            if ($shippedHash -ne $sdkHash) {
              throw "artifacts\$($d.Name) is not the SDK's $($d.FullName) (sha256 $shippedHash vs $sdkHash)"
            }
          }
          Write-Host "OpenVino release verified: $sdkRelease (version.txt '$sdkBuild', openvino.dll '$($embedded[0])'); $($ovDlls.Count) DLLs byte-identical to the SDK"
          Write-Host "NPU stack: LiteRtDispatch + $($ovDlls.Count) OpenVino/TBB DLLs"
          Get-ChildItem artifacts\
          # Every DLL we build ourselves, at the END of this step so that all
          # three are actually in artifacts\ — the first version of this loop
          # ran before StreamProxy and the dispatch were copied and skipped
          # them with a silent `continue`, which is the same vacuity it was
          # written to remove. Missing now means the build is broken: throw.
          # The allow-list is what a Flutter Windows app already ships beside its
          # exe, NOT what the redistributable installs — the redist also carries
          # vcruntime140_threads.dll, and needing that is exactly #456. Checked
          # over every DLL in the bundle, not only ours: openvino/tbb come from
          # Intel's SDK and an SDK bump is precisely how a new CRT import would
          # arrive unnoticed. LiteRtLm must import none at all; LiteRtDispatch
          # links OpenVINO's C++ API and keeps the dynamic CRT.
          $allowed = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $shipped = @(Get-ChildItem artifacts\*.dll | ForEach-Object { $_.Name })
          foreach ($must in @('LiteRtLm.dll', 'LiteRtDispatch.dll', 'StreamProxy.dll')) {
            if ($shipped -notcontains $must) { throw "$must is not in artifacts - this step should have copied it" }
          }
          foreach ($ours in $shipped) {
            $path = "artifacts\$ours"
            $deps = dumpbin /dependents $path
            if (-not ($deps -match '^\s+KERNEL32\.dll')) {
              throw "dumpbin listed no imports for ${ours}:`n$($deps -join "`n")"
            }
            $crt = @($deps -match '^\s+(msvcp|vcruntime|concrt)\d' | ForEach-Object { $_.Trim().ToLower() })
            $bad = @($crt | Where-Object { $allowed -notcontains $_ })
            if ($ours -eq 'LiteRtLm.dll' -and $crt.Count -gt 0) {
              throw "LiteRtLm.dll imports the VC++ runtime: $($crt -join ', ') - static_link_msvcrt did not apply"
            }
            if ($bad.Count -gt 0) {
              throw "$ours imports a VC++ runtime a Flutter Windows app does not ship: $($bad -join ', ')"
            }
            Write-Host "$ours CRT imports: $(if ($crt.Count) { $crt -join ', ' } else { 'none' })"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-windows_x86_64
          path: artifacts/

  # The Qualcomm NPU dispatch for Linux arm64 and our libcdsprpc.so shim. A
  # job of its own: it builds from a standalone LiteRT checkout (the
  # `-Wl,-lc++abi` edit must not reach LiteRT-LM's tree, where Android needs
  # it), against QAIRT headers read out of the 2.6 GB SDK zip by range — the
  # runner's disk cannot hold the SDK beside a Bazel build. The QNN runtime is
  # never built or shipped here: apps fetch it through `qualcomm_npu`.
  build-linux-arm64-qualcomm-dispatch:
    name: Linux arm64 Qualcomm dispatch
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (abseil needs clang >= 15)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          clang-17 --version

      - name: Fetch the QAIRT headers
        run: python3 packages/flutter_edge_ai_litertlm/native/litert_lm/fetch_qairt_sdk_slim.py /tmp/qairt-slim

      - name: Build dispatch and libcdsprpc shim
        run: |
          TARGET=linux_arm64 LITERTLM_REF="$LITERTLM_VERSION" \
          CC=clang-17 CXX=clang++-17 LITERT_QAIRT_SDK=/tmp/qairt-slim \
            bash packages/flutter_edge_ai_litertlm/native/litert_lm/build_qualcomm_dispatch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qualcomm-dispatch-linux_arm64
          path: packages/flutter_edge_ai_litertlm/native/litert_lm/prebuilt/linux_arm64/
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Release
    needs: [build-linux-x86_64, build-linux-arm64, build-windows-x86_64, build-linux-arm64-qualcomm-dispatch]
    if: inputs.publish_release && !inputs.qualcomm_dispatch_linux_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      PREBUILT_REF: ${{ inputs.prebuilt_ref || 'b2f686e2ed4718fb84ec398a61dd59ca0f0aff27' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package archives
        run: |
          mkdir -p release
          # The Linux arm64 Qualcomm dispatch + shim are a separate job's
          # artifact; they ship inside the linux_arm64 archive.
          d=artifacts/qualcomm-dispatch-linux_arm64
          for f in libLiteRtDispatch_Qualcomm.so libcdsprpc.so; do
            [ -s "$d/$f" ] || { echo "::error::$d/$f is missing"; exit 1; }
          done
          cp "$d"/libLiteRtDispatch_Qualcomm.so "$d"/libcdsprpc.so artifacts/litertlm-linux_arm64/
          rm -rf "$d"
          # A missing artifact dir used to be skipped silently. Combined with the
          # delete-old-assets step below and fail_on_unmatched_files, that means:
          # the previous asset is deleted, the replacement is never built, and
          # checksums_litertlm.txt is regenerated over whatever survived — so the
          # published checksums file is internally consistent and quietly short a
          # platform. That is the #316 shape: a self-consistent lie is harder to
          # debug than an obvious gap.
          missing=()
          for dir_name in linux_x86_64 linux_arm64 windows_x86_64; do
            dir="artifacts/litertlm-${dir_name}"
            archive="litertlm-${dir_name}.tar.gz"
            if [ -d "$dir" ]; then
              tar -czf "release/${archive}" -C "$dir" .
              echo "Packaged: ${archive}"
            else
              missing+=("$dir_name")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::missing platform artifacts: ${missing[*]} — refusing to publish a partial release"
            exit 1
          fi
          cd release && sha256sum *.tar.gz > checksums_litertlm.txt
          cat checksums_litertlm.txt

      - name: Delete old CI assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('native-{0}', inputs.litertlm_version) }}
        run: |
          for asset in litertlm-linux_x86_64.tar.gz litertlm-linux_arm64.tar.gz litertlm-windows_x86_64.tar.gz checksums_litertlm.txt; do
            gh release delete-asset "$RELEASE_TAG" "$asset" -y 2>/dev/null || true
          done

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('native-{0}', env.LITERTLM_VERSION) }}
          name: Native Libraries ${{ inputs.release_tag != '' && inputs.release_tag || format('native-{0}', env.LITERTLM_VERSION) }}
          body: |
            LiteRT-LM native libraries built from source ${{ env.LITERTLM_VERSION }}.

            Platforms included (CI-built):
            - Linux x86_64
            - Linux arm64
            - Windows x86_64

            macOS/iOS/Android archives are uploaded separately after local builds.
          files: release/*
          fail_on_unmatched_files: true
