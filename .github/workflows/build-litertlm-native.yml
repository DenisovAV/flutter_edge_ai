name: Build LiteRT-LM Native Libraries

on:
  # Manual only. NO push trigger: this is an expensive multi-platform Bazel
  # build that publishes native libs — auto-firing it on a branch push would
  # rebuild with the DEFAULT litertlm_version (not the one you want), which is
  # exactly how native-v0.13.1 once got the wrong Linux libs. Always dispatch
  # with an explicit litertlm_version.
  workflow_dispatch:
    inputs:
      litertlm_version:
        description: 'LiteRT-LM ref (tag, branch, or commit SHA)'
        required: true
      publish_release:
        description: 'Publish to GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to publish to (blank = native-<litertlm_version>). Use this for a re-release of the same upstream source, e.g. native-v0.17.0-a.'
        required: false
      qualcomm_dispatch_linux_only:
        description: 'Build only the Linux arm64 Qualcomm dispatch + libcdsprpc shim (an artifact to add to an existing linux_arm64 archive); never publishes'
        type: boolean
        default: false

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    if: ${{ !inputs.qualcomm_dispatch_linux_only }}
    # Pin to ubuntu-22.04 (glibc 2.35, GCC 12 libstdc++) for broader
    # compatibility. Everything built here is clang-17 against this runner's
    # libstdc++: libLiteRtLm.so, and from LiteRT-LM v0.20.0 also libLiteRt.so
    # and libLiteRtWebGpuAccelerator.so, which upstream no longer ships
    # prebuilt (c57b9ae0). Each may need up to GLIBC_2.35, GLIBCXX_3.4.30 and
    # CXXABI_1.3.13 and NEEDs libstdc++.so.6 + libgcc_s.so.1 (libLiteRtLm.so
    # needed GLIBC_2.34 on v0.19.1): Ubuntu 22.04+ / Debian 12+ / RHEL 10+.
    # check_linux_bundle.py fails a bundle above that floor. The Google
    # prebuilts that remain (constraint provider, Dawn) need GLIBC 2.26-2.27
    # and no C++ runtime; Google's 0.19.1 libLiteRt.so and accelerator did too.
    runs-on: ubuntu-22.04
    # 40 min on v0.19.1 (run 43178054231). v0.20.0 adds the ML Drift WebGPU
    # delegate to the build: the accelerator is runtime data of
    # //c:libLiteRtLm.dylib in dynamic mode (769af92e), and built by name below.
    timeout-minutes: 150
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (XNNPACK AVX-VNNI requires >=15)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          clang --version

      - name: Clone LiteRT-LM
        run: |
          # Use unshallow + checkout to support both tags and commit SHAs.
          # `git clone --branch SHA` only works for refs, not arbitrary commits.
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM && git checkout "$LITERTLM_VERSION"
          # Only Dawn comes from upstream's prebuilt/. Up to native-v0.19.1
          # Google's prebuilt libGemmaModelConstraintProvider.so did too; from
          # native-v0.20.0-a the tool-call constraints are built with
          # LLGuidance (patch_c_api.sh section 29) and no provider ships.
          git lfs pull --include="prebuilt/linux_x86_64/*"

      - name: Patch C API
        run: bash packages/litertlm_dart/native/litert_lm/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so
        run: |
          cd /tmp/LiteRT-LM
          # Same correction as the Windows job: litert_link_capi_so no longer
          # exists upstream, so it was a no-op and the LiteRt runtime ended up
          # linked statically inside libLiteRtLm. Linux masked that with our
          # RTLD_GLOBAL preload of libLiteRt.so, at the cost of two copies of
          # the runtime in one process — the suspected reason a second
          # engine_create trips 'wgpu::Instance already set'. Upstream docs
          # require litert_runtime_link_mode=dynamic for GPU on every platform.
          #
          # From v0.20.0 upstream's prebuilt/ has no libLiteRt.so and no GPU
          # accelerator (c57b9ae0; only the constraint provider and Dawn are
          # left), so both are built here, in the same invocation and with the
          # same flags as libLiteRtLm. libLiteRt.so was already compiled as a
          # link input of libLiteRtLm on v0.19.1; we shipped Google's copy in
          # its place. The accelerator target is the one runtime/executor/BUILD
          # selects for Linux in dynamic mode (default_dynamic_gpu_accelerator).
          # Both are named explicitly so a select() change upstream fails here
          # instead of shipping nothing.
          bazelisk build -c opt --strip=always \
            --define=litert_runtime_link_mode=dynamic \
            '//c:libLiteRtLm.dylib' \
            '@litert//litert/c:litert_runtime_c_api_so' \
            '@litert//litert/runtime/accelerators/gpu:ml_drift_webgpu_accelerator_so'

      - name: Build libStreamProxy.so
        run: |
          gcc -shared -fPIC -o /tmp/libStreamProxy.so \
            packages/litertlm_dart/native/litert_lm/stream_proxy.c

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/libStreamProxy.so artifacts/
          # No GPU sampler on Linux (patch_c_api.sh section 20): our build of
          # ML Drift's TopK WebGPU sampler crashed the first GPU decode, so it
          # is neither linked in nor shipped and GPU decoding samples on the
          # CPU. The check fails a build that links it in again.
          # (Its RTTI name N6litert2lm17TopKWebGpuSamplerE is in every build
          # that links it, stripped or not.)
          if grep -a -q '17TopKWebGpuSampler' artifacts/libLiteRtLm.so; then
            echo "::error::libLiteRtLm.so links the TopK WebGPU sampler (section 20 did not apply)"; exit 1
          fi
          # litert_runtime_link_mode=dynamic keeps the LiteRt C API OUT of
          # libLiteRtLm, so libLiteRt.so and the accelerator are hard runtime
          # dependencies — shipping without them is a green CI run, a valid
          # SHA256, and a dlopen failure on the user's machine.
          #
          # From v0.20.0 both are ours, built above from LiteRT at the tag's
          # pin (c57b9ae0 removed Google's from prebuilt/). Each is taken from
          # its target's own output path, never from the first match of a
          # recursive search: the .runfiles trees and the _solib_ link farm
          # mirror it (the accelerator is runtime data of //c:libLiteRtLm.dylib,
          # 769af92e). Any other real copy under bazel-bin must be the same
          # bytes, or two builds of it exist and we would not know which ships.
          pick_built() {
            local name="$1" want="/tmp/LiteRT-LM/bazel-bin/external/litert/litert/$2/$1" others=() o
            if [ ! -f "$want" ]; then
              echo "::error::$want was not built"
              exit 1
            fi
            mapfile -t others < <(find /tmp/LiteRT-LM/bazel-bin/ -name "$name" \
              -not -path '*.runfiles/*' -not -path '*/_solib_*')
            for o in "${others[@]}"; do
              [ "$(realpath "$o")" = "$(realpath "$want")" ] && continue
              if ! cmp -s "$o" "$want"; then
                echo "::error::$o differs from $want: two builds of $name under bazel-bin"
                exit 1
              fi
              echo "  identical copy of $name: $o"
            done
            cp "$want" "artifacts/$name"
            echo "$name <- $want"
          }
          pick_built libLiteRt.so c
          pick_built libLiteRtWebGpuAccelerator.so runtime/accelerators/gpu
          # Only Dawn comes from upstream's prebuilt/ now (the constraint
          # provider it also holds is linked by nothing: patch_c_api.sh
          # section 29). A LiteRT runtime or accelerator back in there means
          # upstream ships one again: decide which copy ships rather than
          # letting a glob pick.
          shopt -s nullglob
          pre=/tmp/LiteRT-LM/prebuilt/linux_x86_64
          stale=("$pre"/libLiteRt*.so)
          if [ ${#stale[@]} -ne 0 ]; then
            echo "::error::$pre carries ${stale[*]##*/} again; this workflow ships the LiteRT runtime and accelerator it builds"
            exit 1
          fi
          cp "$pre/libwebgpu_dawn.so" artifacts/
          # A git-lfs pointer stub would pass a bare existence test, so assert
          # ELF, not presence.
          for want in libLiteRtLm.so libLiteRt.so libLiteRtWebGpuAccelerator.so libwebgpu_dawn.so; do
            if [ ! -s "artifacts/$want" ]; then
              echo "::error::missing $want — dynamic link mode requires it at runtime"
              exit 1
            fi
            if [ "$(head -c 4 "artifacts/$want" | od -An -tx1 | tr -d ' ')" != "7f454c46" ]; then
              echo "::error::$want is not an ELF file (git-lfs pointer?)"
              exit 1
            fi
          done
          # Set $ORIGIN rpath so each lib resolves its flat-layout siblings
          # (libLiteRt.so, libwebgpu_dawn.so) from its own
          # directory at dlopen time.
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          chmod u+w artifacts/*.so   # Bazel outputs and git-lfs files are read-only; patchelf edits in place
          # No constraint provider: libLiteRtLm.so must neither NEED nor name
          # one (LLGuidance constraints, patch_c_api.sh section 29).
          named="$(strings artifacts/libLiteRtLm.so | grep 'GemmaModelConstraintProvider' || true)"
          if [ -n "$named" ]; then
            echo "::error::libLiteRtLm.so still needs or names the Gemma constraint provider: $named"
            exit 1
          fi
          for f in artifacts/*.so; do patchelf --set-rpath '$ORIGIN' "$f"; done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-linux_x86_64
          path: artifacts/

      # After the upload, so a failing gate still leaves the bundle to read;
      # the publish job needs this job green.
      - name: Check link closure and symbol binding
        # The Dart client dlopens these RTLD_LAZY | RTLD_GLOBAL: a function
        # symbol nothing defines does not fail the load, it kills the process
        # at its first call ("symbol lookup error"), and nothing in this
        # build calls the GPU. From v0.20.0 libLiteRt.so and the accelerator
        # are ours, built against LiteRT's Dawn headers and linked to Google's
        # Dawn binary. NEEDED closure, SONAMEs, RUNPATH, every undefined
        # symbol, the GLIBC/GLIBCXX/CXXABI floor and the accelerator's single
        # export, on the bytes that ship (review-linux B2).
        run: python3 packages/litertlm_dart/native/litert_lm/check_linux_bundle.py artifacts

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Load the bundle in a plain Dart program (LD_BIND_NOW=1)
        # tool/plain_dart_check against these artifacts (the hook takes a
        # populated native/litert_lm/prebuilt/linux_x86_64/ before any download):
        # libLiteRt, the provider, the accelerator and libLiteRtLm opened the
        # way the client opens them, and an engine create that gets as far as
        # the missing model. LD_BIND_NOW=1 makes ld.so bind every symbol at
        # dlopen, so the "symbol lookup error" the check above reasons about
        # becomes a load failure here. No GPU on the runner: the GPU's own
        # load is not run.
        run: |
          dest=packages/litertlm_dart/native/litert_lm/prebuilt/linux_x86_64
          mkdir -p "$dest"
          cp artifacts/*.so "$dest/"
          cd packages/litertlm_dart/tool/plain_dart_check
          dart pub get
          LD_BIND_NOW=1 dart run bin/plain_dart_check.dart

  build-linux-arm64:
    name: Linux arm64
    if: ${{ !inputs.qualcomm_dispatch_linux_only }}
    # Pin to ubuntu-22.04-arm (glibc 2.35, GCC 12 libstdc++): the same floor
    # as the x86_64 job, held by check_linux_bundle.py.
    runs-on: ubuntu-22.04-arm
    # Raised with the x86_64 job: v0.20.0 builds libLiteRt.so and the ML Drift
    # WebGPU accelerator from source too, and this job also runs three tests.
    timeout-minutes: 150
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (XNNPACK compatibility)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          clang --version

      - name: Clone LiteRT-LM
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM && git checkout "$LITERTLM_VERSION"
          # Only Dawn comes from upstream's prebuilt/. Up to native-v0.19.1
          # Google's prebuilt libGemmaModelConstraintProvider.so did too; from
          # native-v0.20.0-a the tool-call constraints are built with
          # LLGuidance (patch_c_api.sh section 29) and no provider ships.
          git lfs pull --include="prebuilt/linux_arm64/*"

      - name: Patch C API
        run: bash packages/litertlm_dart/native/litert_lm/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so
