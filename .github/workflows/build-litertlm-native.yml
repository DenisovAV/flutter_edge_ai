name: Build LiteRT-LM Native Libraries

on:
  # Manual only. NO push trigger: this is an expensive multi-platform Bazel
  # build that publishes native libs — auto-firing it on a branch push would
  # rebuild with the DEFAULT litertlm_version (not the one you want), which is
  # exactly how native-v0.13.1 once got the wrong Linux libs. Always dispatch
  # with an explicit litertlm_version.
  workflow_dispatch:
    inputs:
      litertlm_version:
        description: 'LiteRT-LM ref (tag, branch, or commit SHA)'
        required: true
      prebuilt_ref:
        description: 'Upstream ref to take prebuilt companion libs from (default: b2f686e2, the v0.18.0 tag itself — its provider already has the new Constraint ABI)'
        required: false
      publish_release:
        description: 'Publish to GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to publish to (blank = native-<litertlm_version>). Use this for a re-release of the same upstream source, e.g. native-v0.17.0-a.'
        required: false
      qualcomm_dispatch_linux_only:
        description: 'Build only the Linux arm64 Qualcomm dispatch + libcdsprpc shim (an artifact to add to an existing linux_arm64 archive); never publishes'
        type: boolean
        default: false

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    if: ${{ !inputs.qualcomm_dispatch_linux_only }}
    # Pin to ubuntu-22.04 (glibc 2.35) for broader compatibility. Our
    # libLiteRtLm.so ends up needing only GLIBC_2.34, which works on
    # Ubuntu 22.04+ / Debian 12+ / RHEL 9+.
    # Google prebuilt companions (libLiteRt.so etc.) only require 2.26-2.27.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      PREBUILT_REF: ${{ inputs.prebuilt_ref || 'b2f686e2ed4718fb84ec398a61dd59ca0f0aff27' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (XNNPACK AVX-VNNI requires >=15)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          clang --version

      - name: Clone LiteRT-LM
        run: |
          # Use unshallow + checkout to support both tags and commit SHAs.
          # `git clone --branch SHA` only works for refs, not arbitrary commits.
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM && git checkout "$LITERTLM_VERSION"
          # Companions from a LATER upstream commit than the source: upstream's
          # 2026-08-21 Constraint change (a8a8c445, a41b7c5c) put ComputeMask in
          # the vtable slot ComputeBitmap had, and the prebuilt provider at the
          # v0.17.0/v0.17.1 tags still implements the old one — a tool call
          # segfaults in CompositeLogitMask::Apply. 4453b286 is upstream's own
          # refresh of those binaries. Their wheel compiles the provider in, so
          # their release lane never sees it.
          git lfs pull --include="prebuilt/linux_x86_64/*"
          # One file, from a different commit than the source: fetch it straight
          # from the LFS media endpoint, where the ref is visible in the URL.
          curl -fsSL -o prebuilt/linux_x86_64/libGemmaModelConstraintProvider.so \
            "https://media.githubusercontent.com/media/google-ai-edge/LiteRT-LM/$PREBUILT_REF/prebuilt/linux_x86_64/libGemmaModelConstraintProvider.so"
          # Fail here, not an hour later in Collect artifacts.
          H=runtime/components/constrained_decoding/constraint.h
          [ -f "$H" ] || { echo "::error::$H is missing, so the provider ABI cannot be checked"; exit 1; }
          # Two-sided: a provider older than the runtime segfaults, and so does
          # a newer one against an older runtime — reachable whenever this runs
          # on a ref from before upstream's 2026-08-21 Constraint change.
          if grep -q 'ComputeMask' "$H"; then want=1; else want=0; fi
          if grep -qa 'LogitMask' "prebuilt/linux_x86_64/libGemmaModelConstraintProvider.so"; then have=1; else have=0; fi
          [ "$want" = "$have" ] || { echo "::error::provider/runtime Constraint ABI mismatch (source ComputeMask=$want, provider LogitMask=$have)"; exit 1; }
          echo "provider ABI: source and provider agree (ComputeMask=$want)"

      - name: Patch C API
        run: bash packages/flutter_edge_ai_litertlm/native/litert_lm/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so
        run: |
          cd /tmp/LiteRT-LM
          # Same correction as the Windows job: litert_link_capi_so no longer
          # exists upstream, so it was a no-op and the LiteRt runtime ended up
          # linked statically inside libLiteRtLm. Linux masked that with our
          # RTLD_GLOBAL preload of libLiteRt.so, at the cost of two copies of
          # the runtime in one process — the suspected reason a second
          # engine_create trips 'wgpu::Instance already set'. Upstream docs
          # require litert_runtime_link_mode=dynamic for GPU on every platform.
          bazelisk build -c opt --strip=always \
            --define=litert_runtime_link_mode=dynamic \
            '//c:libLiteRtLm.dylib'

      - name: Build libStreamProxy.so
        run: |
          gcc -shared -fPIC -o /tmp/libStreamProxy.so \
            packages/flutter_edge_ai_litertlm/native/litert_lm/stream_proxy.c

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/libStreamProxy.so artifacts/
          # `|| true` used to hide an empty glob here. That was survivable when
          # libLiteRt.so was optional; it is not now. litert_runtime_link_mode=dynamic
          # deliberately keeps the LiteRt C API OUT of libLiteRtLm, so these
          # companions became hard DT_NEEDED dependencies — shipping without them
          # is a green CI run, a valid SHA256, and a dlopen failure on the user's
          # machine. A git-lfs pointer stub would pass a bare existence test too,
          # so assert ELF, not presence.
          shopt -s nullglob
          libs=(/tmp/LiteRT-LM/prebuilt/linux_x86_64/*.so)
          if [ ${#libs[@]} -eq 0 ]; then
            echo "::error::no prebuilt .so under prebuilt/linux_x86_64 — git lfs pull produced nothing"
            exit 1
          fi
          cp "${libs[@]}" artifacts/
          for want in libLiteRt.so libLiteRtWebGpuAccelerator.so libwebgpu_dawn.so libGemmaModelConstraintProvider.so; do
            if [ ! -s "artifacts/$want" ]; then
              echo "::error::missing $want — dynamic link mode requires it at runtime"
              exit 1
            fi
            if [ "$(head -c 4 "artifacts/$want" | od -An -tx1 | tr -d ' ')" != "7f454c46" ]; then
              echo "::error::$want is not an ELF file (git-lfs pointer?)"
              exit 1
            fi
          done
          # v0.14.0 Dawn split — libLiteRtWebGpuAccelerator.so now hard-links the
          # separate libwebgpu_dawn.so. Set $ORIGIN rpath so each lib resolves its
          # flat-layout siblings from its own directory at dlopen time.
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          chmod u+w artifacts/*.so   # git-lfs prebuilt .so are read-only; patchelf edits in place
          # The provider must speak the same Constraint ABI as the runtime we just
          # built. Upstream's 2026-08-21 change put ComputeMask where
          # ComputeBitmap was, and a provider built before it segfaults on the
          # first tool call, inside CompositeLogitMask::Apply — with every other
          # check green, because nothing else in this build calls a tool. Assert
          # on the binaries, not on the ref: the v0.17.x tags carry a stale one.
          # Same two-sided assert as the clone step, on the bytes that actually
          # ship. One-sided here would miss a provider NEWER than the runtime,
          # and a `grep -q` on a missing header would skip the check entirely.
          H=/tmp/LiteRT-LM/runtime/components/constrained_decoding/constraint.h
          [ -f "$H" ] || { echo "::error::$H is missing, so the provider ABI cannot be checked"; exit 1; }
          P=artifacts/libGemmaModelConstraintProvider.so
          [ -s "$P" ] || { echo "::error::$P is missing or empty"; exit 1; }
          if grep -q 'ComputeMask' "$H"; then want=1; else want=0; fi
          if grep -q 'LogitMask' "$P"; then have=1; else have=0; fi
          [ "$want" = "$have" ] || { echo "::error::provider/runtime Constraint ABI mismatch in the shipped artifact (source ComputeMask=$want, provider LogitMask=$have)"; exit 1; }
          echo "provider ABI: shipped artifact agrees with this source (ComputeMask=$want)"
          for f in artifacts/*.so; do patchelf --set-rpath '$ORIGIN' "$f"; done
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-linux_x86_64
          path: artifacts/

  build-linux-arm64:
    name: Linux arm64
    if: ${{ !inputs.qualcomm_dispatch_linux_only }}
    # Pin to ubuntu-22.04-arm (glibc 2.35) for broader compatibility.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      LITERTLM_VERSION: ${{ inputs.litertlm_version }}
      PREBUILT_REF: ${{ inputs.prebuilt_ref || 'b2f686e2ed4718fb84ec398a61dd59ca0f0aff27' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-17 (XNNPACK compatibility)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
          clang --version

      - name: Clone LiteRT-LM
        run: |
          git clone https://github.com/google-ai-edge/LiteRT-LM /tmp/LiteRT-LM
          cd /tmp/LiteRT-LM && git checkout "$LITERTLM_VERSION"
          # Companions from a LATER upstream commit than the source: upstream's
          # 2026-08-21 Constraint change (a8a8c445, a41b7c5c) put ComputeMask in
          # the vtable slot ComputeBitmap had, and the prebuilt provider at the
          # v0.17.0/v0.17.1 tags still implements the old one — a tool call
          # segfaults in CompositeLogitMask::Apply. 4453b286 is upstream's own
          # refresh of those binaries. Their wheel compiles the provider in, so
          # their release lane never sees it.
          git lfs pull --include="prebuilt/linux_arm64/*"
          # One file, from a different commit than the source: fetch it straight
          # from the LFS media endpoint, where the ref is visible in the URL.
          curl -fsSL -o prebuilt/linux_arm64/libGemmaModelConstraintProvider.so \
            "https://media.githubusercontent.com/media/google-ai-edge/LiteRT-LM/$PREBUILT_REF/prebuilt/linux_arm64/libGemmaModelConstraintProvider.so"
          # Fail here, not an hour later in Collect artifacts.
          H=runtime/components/constrained_decoding/constraint.h
          [ -f "$H" ] || { echo "::error::$H is missing, so the provider ABI cannot be checked"; exit 1; }
          # Two-sided: a provider older than the runtime segfaults, and so does
          # a newer one against an older runtime — reachable whenever this runs
          # on a ref from before upstream's 2026-08-21 Constraint change.
          if grep -q 'ComputeMask' "$H"; then want=1; else want=0; fi
          if grep -qa 'LogitMask' "prebuilt/linux_arm64/libGemmaModelConstraintProvider.so"; then have=1; else have=0; fi
          [ "$want" = "$have" ] || { echo "::error::provider/runtime Constraint ABI mismatch (source ComputeMask=$want, provider LogitMask=$have)"; exit 1; }
          echo "provider ABI: source and provider agree (ComputeMask=$want)"

      - name: Patch C API
        run: bash packages/flutter_edge_ai_litertlm/native/litert_lm/patch_c_api.sh /tmp/LiteRT-LM

      - name: Build libLiteRtLm.so
        run: |
          cd /tmp/LiteRT-LM
          # Same correction as the Windows job: litert_link_capi_so no longer
          # exists upstream, so it was a no-op and the LiteRt runtime ended up
          # linked statically inside libLiteRtLm. Linux masked that with our
          # RTLD_GLOBAL preload of libLiteRt.so, at the cost of two copies of
          # the runtime in one process — the suspected reason a second
          # engine_create trips 'wgpu::Instance already set'. Upstream docs
          # require litert_runtime_link_mode=dynamic for GPU on every platform.
          bazelisk build -c opt --strip=always \
            --define=litert_runtime_link_mode=dynamic \
            '//c:libLiteRtLm.dylib'

      - name: Build libStreamProxy.so
        run: |
          gcc -shared -fPIC -o /tmp/libStreamProxy.so \
            packages/flutter_edge_ai_litertlm/native/litert_lm/stream_proxy.c

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/LiteRT-LM/bazel-bin/c/libLiteRtLm.dylib artifacts/libLiteRtLm.so
          cp /tmp/libStreamProxy.so artifacts/
          # `|| true` used to hide an empty glob here. That was survivable when
          # libLiteRt.so was optional; it is not now. litert_runtime_link_mode=dynamic
          # deliberately keeps the LiteRt C API OUT of libLiteRtLm, so these
          # companions became hard DT_NEEDED dependencies — shipping without them
          # is a green CI run, a valid SHA256, and a dlopen failure on the user's
          # machine. A git-lfs pointer stub would pass a bare existence test too,
          # so assert ELF, not presence.
          shopt -s nullglob
          libs=(/tmp/LiteRT-LM/prebuilt/linux_arm64/*.so)
          if [ ${#libs[@]} -eq 0 ]; then
            echo "::error::no prebuilt .so under prebuilt/linux_arm64 — git lfs pull produced nothing"
            exit 1
          fi
          cp "${libs[@]}" artifacts/
          for want in libLiteRt.so libLiteRtWebGpuAccelerator.so libwebgpu_dawn.so libGemmaModelConstraintProvider.so; do
            if [ ! -s "artifacts/$want" ]; then
              echo "::error::missing $want — dynamic link mode requires it at runtime"
              exit 1
            fi
            if [ "$(head -c 4 "artifacts/$want" | od -An -tx1 | tr -d ' ')" != "7f454c46" ]; then
              echo "::error::$want is not an ELF file (git-lfs pointer?)"
              exit 1
            fi
          done
          # v0.14.0 Dawn split — libLiteRtWebGpuAccelerator.so now hard-links the
          # separate libwebgpu_dawn.so. Set $ORIGIN rpath so each lib resolves its
          # flat-layout siblings from its own directory at dlopen time.
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          chmod u+w artifacts/*.so   # git-lfs prebuilt .so are read-only; patchelf edits in place
          # The provider must speak the same Constraint ABI as the runtime we just
          # built. Upstream's 2026-08-21 change put ComputeMask where
          # ComputeBitmap was, and a provider built before it segfaults on the
          # first tool call, inside CompositeLogitMask::Apply — with every other
          # check green, because nothing else in this build calls a tool. Assert
          # on the binaries, not on the ref: the v0.17.x tags carry a stale one.
          # Same two-sided assert as the clone step, on the bytes that actually
          # ship. One-sided here would miss a provider NEWER than the runtime,
          # and a `grep -q` on a missing header would skip the check entirely.
          H=/tmp/LiteRT-LM/runtime/components/constrained_decoding/constraint.h
          [ -f "$H" ] || { echo "::error::$H is missing, so the provider ABI cannot be checked"; exit 1; }
