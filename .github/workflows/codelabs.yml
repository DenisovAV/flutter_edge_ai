name: Codelabs

on:
  push:
    branches: [main]
    paths: ['codelabs/**', 'tool/**', '.github/workflows/codelabs.yml']
  pull_request:
    paths: ['codelabs/**', 'tool/**', '.github/workflows/codelabs.yml']
  # The step apps pin published packages, so they can break without anyone
  # touching this repo. A nightly run is what catches that.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Checkout is the only thing that touches the repo.
permissions:
  contents: read

# A PR sync can otherwise run several copies of an 18-resolution job at once.
# The event has to be in the group: `github.ref` is refs/heads/main for a push,
# a manual dispatch AND the nightly alike, so one group would let a push cancel
# the nightly — the only run that catches a published-package regression, and a
# cancelled run notifies nobody.
concurrency:
  group: codelabs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Flutter ${{ matrix.channel }}
    runs-on: ubuntu-latest
    # beta is an early warning, not a gate: a lint that only exists on beta
    # must not turn every PR in the repo red for something no author did.
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      # No setup-java: this job runs pub get / analyze / format / test, none of
      # which invoke Gradle. Add it back if an Android *build* leg is added.
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter --version
      - run: tool/check_codelabs.sh
        env:
          # A rename PR has to test packages before their first pub.dev release.
          # Pushes and nightly runs still resolve published packages.
          CODELAB_USE_LOCAL_PACKAGES: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      # The one check that depends on a third party being up: the codelabs pin
      # exact Hugging Face files, and a rename breaks a learner's first step
      # with nothing in the build noticing. Nightly only — a transient 5xx must
      # not turn a pull request red.
      - name: Model URLs still resolve
        if: github.event_name == 'schedule'
        run: tool/check_codelab_model_urls.sh
      # `continue-on-error` makes a beta failure a green run, which is the
      # point — but a green run is also easy to miss. The script's own
      # `::error::` lines annotate the failing app; this names the channel and
      # says out loud that beta is advisory, in the run summary.
      - name: Report a failed run
        if: failure()
        run: |
          echo "::warning title=Codelabs on Flutter ${{ matrix.channel }} failed::tool/check_codelabs.sh did not pass. On beta this is advisory and gates nothing — it is a preview of the next stable. On stable it is a real failure."
