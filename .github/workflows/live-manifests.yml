# Checks the committed litertlm_manifest.json snapshot
# (packages/flutter_edge_ai_litertlm/test/manifest/fixtures) against the live
# Hugging Face catalog: drift, a new repo shipping a manifest, every variant's
# sha256/size_bytes against the repo's LFS metadata, every resolvable URL, and
# the engine-carried resolver end to end.
#
# This is the one suite in the repo that reaches the network, so it runs on a
# schedule and by hand — never on pull requests. A red run here means "the
# catalog moved" (or Hugging Face is down or rate-limiting), not "this PR
# broke something"; the fix is to regenerate the fixtures per their README.
# The default `flutter test` (tool/test_all.sh, test.yml) skips the same file
# because FLUTTER_GEMMA_LIVE_HF is unset there.
name: Live manifest check (Hugging Face)

on:
  schedule:
    # Weekly, Monday 06:23 UTC. Off the hour: GitHub delays on-the-hour crons.
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  live-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Pub workspace: one root resolve covers every package.
      - name: Install dependencies
        run: flutter pub get

      - name: Check the fixture snapshot against Hugging Face
        working-directory: packages/flutter_edge_ai_litertlm
        env:
          FLUTTER_GEMMA_LIVE_HF: '1'
          # Optional. Raises the anonymous rate limit; empty when the secret
          # is not configured, which the suite treats as "no token".
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # --run-skipped: the suite skips itself unless FLUTTER_GEMMA_LIVE_HF is
        # set, and an all-skipped run exits 0. Without the flag, a renamed or
        # dropped variable would turn every weekly run green with nothing
        # checked. It also runs any skip added to this file later.
        run: flutter test --run-skipped test/manifest/live_hugging_face_test.dart
