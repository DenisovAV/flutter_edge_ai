# Checks every litertlm_manifest.json the hf-to-litertlm orgs serve on Hugging
# Face today: the resolver's invariants on every platform × backend hint,
# every variant's sha256/size_bytes against the repo's LFS metadata, every
# resolvable URL, and the engine-carried resolver end to end.
#
# This is the one suite in the repo that reaches the network, so it runs on a
# schedule and by hand — never on pull requests. A red run here means one of:
# a model listing that came back empty, cut off or without file names; a
# listed manifest that is not served, or that the resolver cannot handle; one
# that disagrees with its repo's files; a resolved URL that does not answer
# 200; the end-to-end resolve failing; or Hugging Face being down or
# rate-limiting. It does not mean "this PR broke something", and it does not
# mean "a model was uploaded": how the catalog differs from the committed
# snapshot (packages/flutter_edge_ai_litertlm/test/manifest/fixtures) is
# written to the run's summary, and does not fail it. The same goes for a
# gated repo this run has no access to — named in the summary, not checked.
# The default `flutter test` (tool/test_all.sh, test.yml) skips the same file
# because FLUTTER_GEMMA_LIVE_HF is unset there.
name: Live manifest check (Hugging Face)

on:
  schedule:
    # Weekly, Monday 06:23 UTC. Off the hour: GitHub delays on-the-hour crons.
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  live-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Pub workspace: one root resolve covers every package.
      - name: Install dependencies
        run: flutter pub get

      - name: Check the manifests Hugging Face serves
        working-directory: packages/flutter_edge_ai_litertlm
        env:
          FLUTTER_GEMMA_LIVE_HF: '1'
          # Optional. Raises the anonymous rate limit; empty when the secret
          # is not configured, which the suite treats as "no token".
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # --run-skipped: the suite skips itself unless FLUTTER_GEMMA_LIVE_HF is
        # set, and an all-skipped run exits 0. Without the flag, a renamed or
        # dropped variable would turn every weekly run green with nothing
        # checked. It also runs any skip added to this file later.
        run: flutter test --run-skipped test/manifest/live_hugging_face_test.dart
