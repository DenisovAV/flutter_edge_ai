name: Flutter Edge AI llama connector

on:
  pull_request:
    paths:
      - 'packages/flutter_edge_ai_llama/**'
      - 'packages/flutter_edge_ai/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/llama.yml'
      - '.github/actions/setup-flutter-llama/**'
  push:
    branches: [main]
    paths:
      - 'packages/flutter_edge_ai_llama/**'
      - 'packages/flutter_edge_ai/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - '.github/workflows/llama.yml'
      - '.github/actions/setup-flutter-llama/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-ai-llama-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_DIRECTORY: packages/flutter_edge_ai_llama

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-flutter-llama
      - run: python tool/verify.py contracts
      - name: Package archive against local core (hosted validation required before publication)
        run: python tool/verify.py package --core-path ../flutter_edge_ai
      - name: Fetch immutable CPU smoke fixture
        run: python tool/fetch_test_model.py
      - name: Real Web CPU smoke
        run: |
          python tool/serve_web_fixture.py --model-path tool/fixtures/chat.gguf &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          python tool/verify.py web --model-url http://127.0.0.1:8098/chat.gguf --storage-helper-url http://127.0.0.1:8098/cache_api.js

  release-build:
    name: Release build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, runner: ubuntu-latest}
          - {platform: ios, runner: macos-26}
          - {platform: macos, runner: macos-26}
          - {platform: windows, runner: windows-latest}
          - {platform: linux, runner: ubuntu-latest}
          - {platform: web, runner: ubuntu-latest}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter-llama
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: python tool/verify.py build --platform ${{ matrix.platform }}

  desktop-runtime:
    name: Native CPU (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-flutter-llama
      - run: python tool/fetch_test_model.py
      - name: Required native CPU smoke
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            python tool/verify.py native --model-path tool/fixtures/chat.gguf --native-diagnostics
          else
            python tool/verify.py native --model-path tool/fixtures/chat.gguf
          fi
      - name: Preserve Apple runtime thread samples
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-${{ matrix.runner }}
          path: ${{ runner.temp }}/edge-ai-native-diagnostics
          if-no-files-found: ignore
      - name: Linux desktop dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - name: Packaged Linux CPU lifecycle
        if: matrix.runner == 'ubuntu-latest'
        run: xvfb-run -a python tool/verify.py device --device linux --model-path tool/fixtures/chat.gguf

  ios-runtime:
    name: iOS simulator CPU
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: ./.github/actions/setup-flutter-llama
      - name: Boot available ARM64 iPhone simulator and exercise packaged runtime
        run: |
          test "$(uname -m)" = arm64
          simulator_id="$(xcrun simctl list devices available -j | python -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          trap 'xcrun simctl shutdown "$simulator_id"' EXIT
          python tool/verify.py device --device "$simulator_id" --model-url https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q8_0.gguf --native-diagnostics

      - name: Preserve iOS runtime thread samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics-ios-simulator
          path: ${{ runner.temp }}/edge-ai-native-diagnostics
          if-no-files-found: ignore

  android-runtime:
    name: Android emulator CPU
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter-llama
      - name: Enable KVM for the isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          script: cd "$PACKAGE_DIRECTORY" && python tool/verify.py device --device emulator-5554 --model-url https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q8_0.gguf
