# Build the flutteredge.ai website on every PR that touches it — no deploy.
# Catches SSG / web-build breakage (e.g. a non-Dart code fence that crashes the
# Jaspr highlighter, or a dart2js API drift in the /try example) BEFORE merge,
# instead of only discovering it when the merge deploy fails and the live site
# is left on the previous build.
name: Website build check (PR)
on:
  pull_request:
    paths:
      - 'website/**'
      - 'packages/flutter_edge_ai/example/**'
      - '.github/workflows/website-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (bundles Dart)
        uses: subosito/flutter-action@v2
        with:
          # The workspace floor: flutter_edge_ai_sqlite needs 3.47 for
          # sqlite3 3.6.0, and this job builds the example that depends on it.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Jaspr CLI
        # Pin to 0.23.1 — jaspr_cli 0.23.2 fails with "Failed to start build
        # daemon, port file is missing" (build-daemon regression). Matches the
        # `jaspr: ^0.23.1` pin in website/pubspec.yaml. Bump deliberately.
        run: dart pub global activate jaspr_cli 0.23.1

      - name: Build Jaspr site (SSG)
        working-directory: website
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          dart pub get
          jaspr build --sitemap-domain "https://flutteredge.ai"

      - name: Export codelabs (claat static export → /codelabs)
        # The SAME script the merge workflow runs — that is the point of this
        # step. It used to be a hand-copied twin, which meant the PR gate could
        # be green while the export logic the live deploy actually uses was
        # broken. Binary pinned by SHA-256 (the tag is mutable) to match the
        # deploy workflow.
        working-directory: website
        run: |
          # Version and hashes come from tool/claat_pin.env, the one place all
          # three callers read them from; the verify stays here, inline, in the
          # file a reviewer of a secret-bearing job actually opens.
          . tool/claat_pin.env
          curl -fL --retry 3 -o "$RUNNER_TEMP/claat" \
            "$CLAAT_BASE_URL/$CLAAT_VERSION/claat-linux-amd64"
          echo "$CLAAT_SHA256_linux_amd64  $RUNNER_TEMP/claat" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/claat"
          CLAAT="$RUNNER_TEMP/claat" DOMAIN="https://flutteredge.ai" \
            tool/export_codelabs.sh

      - name: Build Flutter web example (live demo at /try)
        working-directory: packages/flutter_edge_ai/example
        run: |
          flutter pub get
          flutter build web --release --base-href /try/
