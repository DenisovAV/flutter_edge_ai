name: workshop_genkit_flutter_hybrid_ai
description: "Workshop: Hybrid AI in Flutter — From Cloud to On-Device with Genkit Dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Step 2: Uncomment to add Cloud AI
  # genkit: ^1.0.0
  # genkit_google_genai: ^1.0.0

  # Step 3: Uncomment to add On-device AI (LiteRT-LM engine)
  # genkit_flutter_edge_ai: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Swift Package Manager off: on macOS the LiteRT-LM companion libraries are
  # staged by the Podfile post_install block, and an SPM-only app has no Podfile.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/tourist_data/
