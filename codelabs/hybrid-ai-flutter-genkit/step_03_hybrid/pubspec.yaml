name: workshop_genkit_flutter_hybrid_ai
description: "Workshop: Hybrid AI in Flutter — From Cloud to On-Device with Genkit Dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cloud AI via Gemini API (Genkit)
  genkit: ^0.16.0
  genkit_google_genai: ^0.3.1

  # On-device AI via genkit_flutter_edge_ai
  genkit_flutter_edge_ai: ^0.7.0
  # Core registers no runtime by default. ai_engine.dart explicitly registers
  # LiteRT-LM and the EmbeddingGemma tokenizer provider from these packages.
  flutter_edge_ai: ^2.0.0
  flutter_edge_ai_litertlm: ^1.8.7
  flutter_edge_ai_embeddings: ^2.2.2

  # Hybrid on-device ↔ cloud routing
  genkit_hybrid: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tourist_data/
