name: workshop_genkit_flutter_hybrid_ai
description: "Workshop: Hybrid AI in Flutter — From Cloud to On-Device with Genkit Dart"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cloud AI via Gemini API (Genkit)
  genkit: ^0.16.0
  genkit_google_genai: ^0.3.1

  # On-device AI via genkit_flutter_edge_ai
  genkit_flutter_edge_ai: ^0.6.2
  # Pinned below flutter_edge_ai 1.9.0 / flutter_edge_ai_litertlm 1.8.0 on purpose.
  # Those versions move the embedding tokenizer to a registered provider: an app
  # must add flutter_edge_ai_embeddings and pass
  # `embeddingTokenizers: [GemmaEmbeddingTokenizers()]` to initialize(), or the
  # first embedding throws. This codelab gets that in its own change; until then
  # a caret would silently upgrade it into a runtime failure on the RAG step.
# Lift all three back to carets in the same change that adds the registration.
  flutter_edge_ai: ^1.11.4
  # LiteRT-LM engine (.litertlm inference) + LiteRT embedding backend —
  # flutter_edge_ai 1.x registers no engines by default; opt in here.
  flutter_edge_ai_litertlm: ^1.8.6
  # Bounded for the same reason, and it must be lifted with the two above: this
  # arrives transitively through flutter_edge_ai_litertlm, and 2.2.0 belongs to
  # the release that needs the tokenizer registration. Declared here so the
  # guarantee is local instead of resting on a constraint in another package.
  flutter_edge_ai_embeddings: ^2.2.1

  # Hybrid on-device ↔ cloud routing
  genkit_hybrid: ^0.2.1

  # Image input (multimodal)
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tourist_data/
