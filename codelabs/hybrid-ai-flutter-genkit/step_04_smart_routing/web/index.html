<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gemma Hybrid AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gemma Hybrid AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- LiteRT-LM's web arm loads `@litert-lm/core` from a CDN. The ESM assigns
       no window globals and module scripts are deferred, so Dart waits on the
       promise this handshake publishes. Native platforms need no web setup.
       The handshake below is the flutter_edge_ai_litertlm README's, verbatim. -->
<script type="module">
window.litertLmReady = (async () => {
  const m = await import('https://cdn.jsdelivr.net/npm/@litert-lm/core@0.17.1/+esm');
  window.Engine = m.Engine;
  return m.Engine;
})();
</script>

  <!-- Cache API for persistent storage -->
  <script src="cache_api.js"></script>

  <!-- OPFS Helper for large model streaming (>2GB) -->
  <script src="opfs_helper.js"></script>

  <!-- LiteRT.js embeddings bundle (RAG). The four files beside this one are
       copied from flutter_edge_ai_litertlm/web/, the package that owns them.
       The WASM runtime they need comes from a CDN. -->
  <script type="module" src="litert_embeddings.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
