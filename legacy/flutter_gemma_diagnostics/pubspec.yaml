name: flutter_gemma_diagnostics
description: "Moved to flutter_edge_ai_diagnostics. This is the final release under the name flutter_gemma_diagnostics; new versions ship as flutter_edge_ai_diagnostics, part of Flutter Edge AI."
version: 0.1.1
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/legacy/flutter_gemma_diagnostics
topics: [memory, diagnostics, gemma, on-device]

# Android and iOS only, on purpose: jetsam and lmkd are why these numbers differ
# from RSS, and "will I be killed" is a mobile question. Every value is read
# from the OS (/proc on Android, Mach + libsystem on iOS) through dart:io and
# dart:ffi, so the package carries no Kotlin, Swift, Gradle or podspec.
platforms:
  android:
  ios:


environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# No flutter_gemma dependency: the probe measures the process, not an engine,
# so it works next to any engine and can sit in dev_dependencies.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
