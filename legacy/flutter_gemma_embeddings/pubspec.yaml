name: flutter_gemma_embeddings
description: "Moved to flutter_edge_ai_embeddings. This is the final release under the name flutter_gemma_embeddings; new versions ship as flutter_edge_ai_embeddings, part of Flutter Edge AI."
version: 2.2.2
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/legacy-final/legacy/flutter_gemma_embeddings
topics: [embeddings, gemma, litert, rag, on-device]

# All six platforms: pure Dart, no native handle and no web asset of its own.
# Declared explicitly so the supported set is the package's own contract, not
# inferred from the transitive import graph.
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:


environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # ^1.9.0: this version needs core's embedding seam and the tokenizer
  # registry (`EmbeddingTokenizerRegistry`), which land in 1.9.0. An older
  # core resolves and then fails to compile — better here than there.
  flutter_gemma: ^1.9.0
  # Floor is 1.4.1, not 1.3.3, and that is deliberate. 1.4.0 added
  # `pre_tokenizer` validation with no `Split` case and rejected the
  # Gemma-family tokenizer.json this package loads (upstream #35); 1.4.1 accepts
  # it again, guarded on the normalizer proving no literal space survives.
  #
  # 1.4.x also began applying the file's own `padding` and `truncation` blocks,
  # which 1.3.3 ignored — so `encode()` no longer returns bare content by
  # default. `loadEmbeddingTokenizer` calls `noPadding()`/`noTruncation()` to
  # pin that contract, and `siglip_loader_contract_test.dart` fails if a future
  # release changes it again. Do NOT lower this floor — but note that nothing
  # enforces it: `noPadding()`/`noTruncation()` exist in 1.3.3 too, so a lowered
  # floor would compile and probably run green.
  #
  # The binding reason is the CARET, not 1.3.3 itself: `^1.3.3` admits 1.4.0,
  # which rejects the `Split` block outright. 1.4.1 is the first version that
  # both accepts the file and is inside a caret range.
  #
  # 1.3.x also ZigZag-decoded a `.model`'s signed varints, reading unk/bos/eos as
  # -2/1/-1 instead of 3/2/1 (`pad` = 0 survives, being its own ZigZag). Not the
  # reason for the floor and not a safe thing to reason about casually — leave it
  # as one more thing 1.3.x gets wrong.
  dart_sentencepiece_tokenizer: "^1.4.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No flutter: plugin/asset block, no hook/build.dart of its own, and — since
# the embedder decoupling refactor (2.0.0) — NO dependency on
# flutter_gemma_litertlm: this package no longer touches dart:ffi or any
# native handle at all. It owns the tokenizers and their routing; the seam,
# the isolate worker and the pooling live in flutter_gemma, and the concrete
# forward pass in whichever engine package supplies it (e.g.
# flutter_gemma_litertlm's LiteRtEmbeddingBackend).
