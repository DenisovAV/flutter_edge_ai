name: flutter_gemma_mediapipe
description: "Renamed to flutter_edge_ai_mediapipe. This is the final flutter_gemma_mediapipe release; new versions ship as flutter_edge_ai_mediapipe, part of Flutter Edge AI."
version: 1.0.9
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/legacy/flutter_gemma_mediapipe
topics: [gemma, llm, mediapipe, on-device, ai]


environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.0.2
  mutex: ^3.1.0
  plugin_platform_interface: ^2.0.2
  # Direct import in the pigeon-generated lib/pigeon.g.dart (immutable, etc.).
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutterberlin.flutter_gemma_mediapipe
        pluginClass: FlutterGemmaMediaPipePlugin
      ios:
        pluginClass: FlutterGemmaMediaPipePlugin
