name: flutter_gemma_rag_qdrant
description: "Moved to flutter_edge_ai_qdrant. This is the final release under the name flutter_gemma_rag_qdrant; new versions ship as flutter_edge_ai_qdrant, part of Flutter Edge AI."
version: 1.3.3
homepage: https://fluttergemma.dev
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/legacy/flutter_gemma_rag_qdrant
topics: [rag, qdrant, vector-search, embeddings, on-device]

# Native-only (qdrant-edge Rust FFI). Declared explicitly so the supported
# platform set is the package's own contract, not inferred from the transitive
# import graph. No web — use flutter_gemma_rag_sqlite (WebSqliteVectorStore).
platforms:
  android:
  ios:
  macos:
  windows:
  linux:


environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.8.1
  uuid: ^4.0.0
  # For the store's owned-subdir path handling (qdrant_edge_v1).
  path: ^1.9.0
  # Official Qdrant Edge Dart SDK (UniFFI binding of the shared qdrant-edge-ffi
  # crate). Exact pin (no caret): a caret on a `-dev` prerelease could resolve
  # to a later prerelease with a different API/native archive.
  qdrant_edge: 0.8.0-dev.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No flutter: plugin/asset block — the native lib is delivered as a CodeAsset by
# the qdrant_edge SDK's Native Assets build hook, not a platform-channel plugin.
