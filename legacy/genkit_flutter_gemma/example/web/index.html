<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="genkit_flutter_gemma_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>genkit_flutter_gemma_example</title>
  <link rel="manifest" href="manifest.json">

  <!-- This app registers LiteRtLmEngine, MediaPipeEngine and
       LiteRtEmbeddingBackend (lib/main.dart), and each of the three needs its
       own JS in the page before Dart touches it. ONNX and sqlite-vec are NOT
       registered here, so their shims are deliberately absent — see
       packages/flutter_gemma/example/web/index.html for the full set. -->

  <!-- MediaPipe GenAI for inference (.task models) -->
  <script type="module">
  import { FilesetResolver, LlmInference } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.27';
  window.FilesetResolver = FilesetResolver;
  window.LlmInference = LlmInference;
  </script>

  <!-- LiteRT-LM web inference (.litertlm, early preview). The `@litert-lm/core`
       ESM does not assign window globals and module scripts are deferred, so
       Dart would reach `LiteRtLmEngine.create()` before `Engine` is bound. This
       promise is what it awaits. -->
  <script type="module">
  window.litertLmReady = (async () => {
    const m = await import('https://cdn.jsdelivr.net/npm/@litert-lm/core@0.17.0/+esm');
    window.Engine = m.Engine;
    return m.Engine;
  })();
  </script>

  <!-- Cache API for persistent model storage -->
  <script src="cache_api.js"></script>

  <!-- OPFS helper for streaming large models (>2GB) -->
  <script src="opfs_helper.js"></script>

  <!-- LiteRT.js embeddings bundle. The four files beside this one
       (litert.js, litert_embeddings.js, sentencepiece.js, tensorflow.js) are
       copied from flutter_gemma_litertlm/web/ — that package owns them since
       1.8.0. -->
  <script type="module" src="litert_embeddings.js"></script>

</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
