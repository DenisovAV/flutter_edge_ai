# What the documentation and release notes say works, imported as
# "documented": shown on the website with its source, never as verified. A run
# recorded by the evidence collector replaces a documented cell. A claim the
# package's own rules contradict (a backend it does not run there) fails
# `registry.dart check`.
#
# Each claim: `variants` (variant ids, `<model id>/<slug>`), the
# `hosts` and `backends`, `status` (documented or broken), the `source`, and an
# `issue` for a broken claim. A source is a pull request ("PR #688, ...",
# quoted: ` #` starts a YAML comment) or docs lines pinned to a commit on main
# (`website/content/docs/<page>.md@<commit>:<line>[-<line>]`), so a later edit
# of the page does not move what the claim cites.
#
# Left out on purpose, as the documentation review found them unrun: Intel
# PTL bundles, Google Tensor G5 bundles, the Qualcomm SM8550 and SM8750
# EmbeddingGemma 2 bundles, and Linux arm64 for anything but the CPU.

