name: flutter_edge_ai_example
description: "Demonstrates how to use the flutter_edge_ai plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=3.12.0 <4.0.0'
  # Inherited from the flutter_edge_ai_sqlite path dependency, which needs
  # sqlite3 3.6.0 and therefore Flutter 3.47. Declared rather than left to be
  # discovered, so the solver names this app instead of a transitive package.
  flutter: '>=3.47.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  equatable: ^2.0.3
  flutter_bloc: ^8.0.1
  flutter_edge_ai:
    path: ../
  flutter_edge_ai_rag:
    path: ../../flutter_edge_ai_rag
  flutter_edge_ai_sqlite:
    path: ../../flutter_edge_ai_sqlite
  flutter_edge_ai_qdrant:
    path: ../../flutter_edge_ai_qdrant
  flutter_edge_ai_litertlm:
    path: ../../flutter_edge_ai_litertlm
  flutter_edge_ai_embeddings:
    path: ../../flutter_edge_ai_embeddings
  flutter_edge_ai_speech:
    path: ../../flutter_edge_ai_speech
  flutter_edge_ai_mediapipe:
    path: ../../flutter_edge_ai_mediapipe
  flutter_edge_ai_agent:
    path: ../../flutter_edge_ai_agent
  flutter_edge_ai_builtin_ai:
    path: ../../flutter_edge_ai_builtin_ai
  flutter_edge_ai_onnx:
    path: ../../flutter_edge_ai_onnx

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

  # App-level packages used by the example UI. These MUST be declared here (not
  # only in dependency_overrides) — an override without a real dependency entry
  # is ignored by pub, so the plugin would drop out of the plugin graph and the
  # generated registrant (desktop audio/url_launcher broke this way after the
  # 1.0 split). Versions mirror the overrides below.
  flutter_markdown: ^0.7.1
  url_launcher: ^6.3.1
  http: ^1.3.0
  web: ^1.1.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  background_downloader: ^9.2.3
  image_picker: ^1.0.4
  record: ^6.0.0
  permission_handler: ^11.3.1
  just_audio: ^0.9.36

# The opt-in packages now declare a HOSTED dependency on flutter_edge_ai
# (`^1.0.0-rc.1`) for publishing. This example consumes the local source, so
# override flutter_edge_ai to the local path — this resolves the path-vs-hosted
# conflict (every package, including the siblings, resolves core from source).
# Same conflict for flutter_edge_ai_litertlm (flutter_edge_ai_speech declares a
# hosted dependency on it) and, since the embedder decoupling refactor
# (litertlm 1.5.0 / embeddings 2.0.0), for flutter_edge_ai_embeddings too:
# flutter_edge_ai_litertlm now declares a hosted dependency on
# flutter_edge_ai_embeddings (D3 edge — the direction flipped from the
# pre-2.0.0 shape, where embeddings hosted-depended on litertlm).
# Overrides only apply to this example; they are ignored for published packages.
dependency_overrides:
  flutter_edge_ai:
    path: ../
  flutter_edge_ai_rag:
    path: ../../flutter_edge_ai_rag
  flutter_edge_ai_litertlm:
    path: ../../flutter_edge_ai_litertlm
  flutter_edge_ai_embeddings:
    path: ../../flutter_edge_ai_embeddings
  flutter_markdown: ^0.7.1
  url_launcher: ^6.3.1
  http: ^1.3.0
  web: ^1.1.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  background_downloader: ^9.2.3  # For integration tests

  # Dependencies for working with images
  image_picker: ^1.0.4 # For selecting images on mobile devices

  # Dependencies for working with audio
  record: ^6.0.0                  # Audio recording
  permission_handler: ^11.3.1     # Microphone permissions
  just_audio: ^0.9.36             # Audio playback (for preview)

dev_dependencies:
  # The web store integration test opens the same IndexedDB VFS the store
  # uses, to plant a corpus the store cannot read.
  sqlite3: ^3.6.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  path: ^1.9.0
  # Used by integration_test/diagnostics_memory_test.dart and
  # integration_test/benchmark_comparison_test.dart.
  flutter_edge_ai_diagnostics:
    path: ../../flutter_edge_ai_diagnostics

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/models/
    - assets/test/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
