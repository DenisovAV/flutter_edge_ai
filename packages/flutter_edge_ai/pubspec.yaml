name: flutter_edge_ai
description: "Run Gemma and other AI models on-device in Flutter across Android, iOS, Web, macOS, Windows, and Linux."
version: 2.0.0
resolution: workspace
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai
topics: [gemma, llm, ai, on-device, multimodal]

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  large_file_handler: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  plugin_platform_interface: ^2.0.2
  shared_preferences: ^2.5.2
  background_downloader: ^9.5.6
  # Native Assets build hooks (for hook/build.dart)
  hooks: ^2.0.0
  code_assets: ^1.2.0
  crypto: ^3.0.6
  genai_primitives: ^0.2.3
  # Annotations (@immutable, @visibleForTesting) used across core, e.g. chat.dart.
  meta: ^1.15.0
  # Serializes native LiteRT-LM conversation calls across concurrent
  # sessions — the C API is not documented as reentrant on one engine.
  mutex: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.0
  mocktail: ^1.0.0
  fake_async: ^1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: dev.flutterberlin.flutter_gemma
        pluginClass: FlutterEdgeAiPlugin
      ios:
        pluginClass: FlutterEdgeAiPlugin
      web:
        pluginClass: FlutterEdgeAiWeb
        fileName: web/flutter_edge_ai_web.dart
      macos:
        pluginClass: FlutterEdgeAiPlugin
        dartPluginClass: FlutterEdgeAiDesktop
      windows:
        pluginClass: FlutterEdgeAiPlugin
        dartPluginClass: FlutterEdgeAiDesktop
      linux:
        pluginClass: FlutterEdgeAiPlugin
        dartPluginClass: FlutterEdgeAiDesktop

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
