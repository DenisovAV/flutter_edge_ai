name: flutter_edge_ai_builtin_ai
description: "Opt-in flutter_edge_ai engine for the OS built-in model: Gemini Nano (Android), Apple Foundation Models (iOS/macOS), Windows AI Foundry, Chrome's Prompt API on Web."
version: 0.3.6
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_builtin_ai
topics: [gemma, llm, gemini-nano, on-device, prompt-api]

# No `flutter: plugin:` block: the native layer now lives in flutter_local_ai,
# so this is a plain Flutter package, not a plugin. The supported set is
# declared here rather than inferred from the transitive graph — it is
# flutter_local_ai's plugin platforms (Windows included; Linux has no built-in
# model).
platforms:
  android:
  ios:
  macos:
  windows:
  web:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # ^2.3.0: imports `package:flutter_edge_ai/engine.dart`, which 2.3.0 adds;
  # 2.2.0 made the sampling values nullable. Every RuntimeConfig field this
  # engine reads (supportAudio, loraRanks, maxNumImages, maxConcurrentSessions)
  # is older than either.
  flutter_edge_ai: ^2.3.0
  # Supplies the whole native/web layer this package used to ship itself.
  flutter_local_ai: ^0.3.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
