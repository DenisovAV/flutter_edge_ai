name: flutter_edge_ai_diagnostics
description: "Opt-in memory diagnostics for flutter_edge_ai apps: the memory the OS cannot reclaim and the memory still available, read from the OS on Android and iOS."
version: 0.2.1
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_diagnostics
topics: [memory, diagnostics, gemma, on-device]

# Android and iOS only, on purpose: jetsam and lmkd are why these numbers differ
# from RSS, and "will I be killed" is a mobile question. Every value is read
# from the OS (/proc on Android, Mach + libsystem on iOS) through dart:io and
# dart:ffi, so the package carries no Kotlin, Swift, Gradle or podspec.
platforms:
  android:
  ios:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# No flutter_edge_ai dependency: the probe measures the process, not an engine,
# so it works next to any engine and can sit in dev_dependencies.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
