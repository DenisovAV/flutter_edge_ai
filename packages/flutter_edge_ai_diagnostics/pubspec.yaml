name: flutter_edge_ai_diagnostics
description: "Opt-in Android, iOS and macOS process memory diagnostics: footprint, its peak, resident clean pages and available memory, read from the OS."
version: 0.4.0
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_diagnostics
topics: [memory, diagnostics, gemma, on-device]

# Android, iOS and macOS only, on purpose: jetsam and lmkd are why these numbers
# differ from RSS, and "will I be killed" is a mobile question; macOS shares the
# Mach call iOS uses. Every value is read from the OS (/proc on Android, Mach +
# libsystem on iOS and macOS) through dart:io and dart:ffi, so the package
# carries no Kotlin, Swift, Gradle or podspec.
platforms:
  android:
  ios:
  macos:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# No flutter_edge_ai dependency: the probe measures the process, not an engine,
# so it works next to any engine and can sit in dev_dependencies.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
