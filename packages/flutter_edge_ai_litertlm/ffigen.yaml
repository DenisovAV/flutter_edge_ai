# Bindings for the LiteRT-LM inference C API (engine, session, conversation),
# C API 1.0: every call that can fail returns a LiteRtLmStatusCode and writes
# its result through an out-parameter.
#
# Input: native/litert_lm/include/c/, upstream LiteRT-LM's `c/` headers copied
# verbatim at the pinned commit 771b06e1 (= v0.19.0), except for section 14's
# two getters in embedding_engine.h, and
# native/litert_lm/include/flutter_edge_ai/litert_lm_patches.h, the
# declarations patch_c_api.sh adds (sections 2, 3, 16 and 23). Every LiteRT-LM
# pin bump replaces both from a patched tree and regenerates both binding files
# (this one and ffigen_embedding.yaml's).
#
# LiteRtLmStatusCode is generated as plain int constants, not a Dart enum: a
# code the enum does not list must reach the status check, not throw in
# `fromValue`.
#
# Regenerate (from this directory; ffigen is no dependency of the workspace,
# and 20.1.1 is the version that reproduces the generated files' format):
#   dart pub global activate ffigen 20.1.1
#   dart pub global run ffigen --config ffigen.yaml
name: 'LiteRtLmBindings'
description: 'FFI bindings for the LiteRT-LM inference C API (C API 1.0)'
output: 'lib/src/ffi/litert_lm_bindings.dart'
headers:
  entry-points:
    - 'native/litert_lm/include/c/engine.h'
    - 'native/litert_lm/include/c/conversation.h'
    - 'native/litert_lm/include/flutter_edge_ai/litert_lm_patches.h'
  include-directives:
    - '**/include/c/engine.h'
    - '**/include/c/conversation.h'
    - '**/include/c/error_reporter.h'
    - '**/include/flutter_edge_ai/litert_lm_patches.h'
compiler-opts:
  - '-I'
  - 'native/litert_lm/include'
functions:
  include:
    - 'litert_lm_.*'
  exclude:
    # The embedding and ModelInfo calls are ffigen_embedding.yaml's.
    - 'litert_lm_embedding_.*'
    - 'litert_lm_loaded_file_.*'
enums:
  as-int:
    include:
      - 'LiteRtLmStatusCode'
silence-enum-warning: true
preamble: |
  // AUTO-GENERATED by ffigen from ffigen.yaml - DO NOT EDIT
  // Source: native/litert_lm/include/c/{engine,conversation,error_reporter}.h
  // (LiteRT-LM 771b06e1 = v0.19.0) and
  // native/litert_lm/include/flutter_edge_ai/litert_lm_patches.h
