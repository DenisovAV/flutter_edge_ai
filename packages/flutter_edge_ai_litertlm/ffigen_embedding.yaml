# Bindings for the LiteRT-LM EmbeddingEngine, ModelInfo and error-reporter C API
# (the EmbeddingGemma 2 `.litertlm` pass, R5 §4.10-§4.11). A second config,
# separate from ffigen.yaml: that one generated litert_lm_bindings.dart from the
# hand-maintained native/litert_lm/include/engine.h, which predates v0.18.0 (its
# LiteRtLmInputData is still a by-value struct) and is not regenerated here.
#
# Input: native/litert_lm/include/c/, upstream LiteRT-LM's `c/` headers copied
# verbatim at the pinned commit b2f686e2 (= v0.18.0, the source of
# native-v0.18.0-e), plus the two response getters patch_c_api.sh section 14
# adds (declared in embedding_engine.h; the pass reads both for every request).
# Every LiteRT-LM pin bump replaces them, re-adds section 14, and regenerates.
#
# Regenerate (from this directory; ffigen is no dependency of the workspace,
# and 20.1.1 is the version that reproduces the generated files' format):
#   dart pub global activate ffigen 20.1.1
#   dart pub global run ffigen --config ffigen_embedding.yaml
name: 'LiteRtLmEmbeddingBindings'
description: >-
  FFI bindings for the LiteRT-LM EmbeddingEngine, ModelInfo and error-reporter
  C API
output: 'lib/src/ffi/litert_lm_embedding_bindings.dart'
headers:
  entry-points:
    - 'native/litert_lm/include/c/embedding_engine.h'
    - 'native/litert_lm/include/c/model_info.h'
    - 'native/litert_lm/include/c/error_reporter.h'
  include-directives:
    - '**/include/c/embedding_engine.h'
    - '**/include/c/model_info.h'
    - '**/include/c/error_reporter.h'
    - '**/include/c/engine.h'
compiler-opts:
  - '-I'
  - 'native/litert_lm/include'
functions:
  include:
    - 'litert_lm_embedding_.*'
    - 'litert_lm_loaded_file_.*'
    - 'litert_lm_get_last_error_.*'
    - 'litert_lm_clear_last_error'
    - 'litert_lm_input_data_create'
    - 'litert_lm_input_data_delete'
  exclude:
    # D23: these report towers the EmbeddingGemma 2 bundles do not have
    # (vision and audio on the text-only 270m, audio on the 440m). Image
    # support is read from litert_lm_loaded_file_vision_signature_selection
    # instead; not binding them keeps them out of reach.
    - 'litert_lm_loaded_file_supports_input_modality'
    - 'litert_lm_loaded_file_max_vision_token_budget'
    - 'litert_lm_loaded_file_modality_supported_backends'
    # D26: batching brought no gain (3.65 s vs 3.74 s for 100 chunks).
    - 'litert_lm_embedding_engine_compute_embedding_batch'
    - 'litert_lm_embedding_responses_.*'
# Types: only what the bound functions use (ffigen pulls dependencies in).
structs:
  include: []
unions:
  include: []
enums:
  include: []
unnamed-enums:
  include: []
globals:
  include: []
macros:
  include: []
typedefs:
  include: []
silence-enum-warning: true
preamble: |
  // AUTO-GENERATED by ffigen from ffigen_embedding.yaml - DO NOT EDIT
  // Source: native/litert_lm/include/c/{embedding_engine,model_info,error_reporter}.h
  // (LiteRT-LM b2f686e2 = v0.18.0)
