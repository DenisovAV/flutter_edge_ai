name: flutter_edge_ai_litertlm
description: "LiteRT-LM (.litertlm) engine for flutter_edge_ai: dart:ffi on 5 native platforms plus web, CPU/GPU/NPU, and the LiteRT embedding backend."
version: 1.18.1
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_litertlm
topics: [gemma, llm, litert, on-device, ffi]

# All six platforms: 5 native via dart:ffi (LiteRT-LM C API) + web via
# @litert-lm/core. Declared explicitly so the supported set is the package's own
# contract, not inferred from the transitive import graph.
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # ^2.5.0: this version implements the option-scoring SPI
  # (`OptionScoringModel`, `OptionScorer`) and `MultiModelEngine` (for
  # `FlutterEdgeAi.openModel`), which arrive in 2.5.0. 2.4.0 brought
  # what it fills: `InferenceModel.activeVisionBackend` /
  # `activeAudioBackend`, sends a message's media in the
  # `RuntimeConfig.multimodalOrder` (`MultimodalOrder`, `MediaPosition`) and
  # reports `EmbeddingPassInfo.visionTokensPerImage`, all of which arrived in
  # 2.4.0. 2.3.1 brought the public `EmbeddingInput(text:, images:, audio:)`
  # constructor for the combined EmbeddingGemma 2 inputs it embeds. 2.3.0 brought
  # what it implements — `package:flutter_edge_ai/
  # engine.dart` and the embedding pass SPI (`EmbeddingBackendProvider
  # .describe`, `EmbeddingPassDescriptor`, `TokenEmbeddingPass`, the
  # `EmbeddingException` family) — and the floor also covers 2.2.0's nullable
  # sampling values, 1.10.0's `activationDataType`, 1.8.4's runtime tool path
  # for FunctionGemma and 1.7.3's `createChat` fix, without which web function
  # calling resolves, compiles, and the tools silently never reach the model.
  flutter_edge_ai: ^2.5.1
  ffi: ^2.1.0
  mutex: ^3.1.0
  hooks: ^2.0.0
  code_assets: ">=1.2.0 <3.0.0"
  crypto: ^3.0.6
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only live_hugging_face_test.dart (opt-in) drives the full
  # FlutterEdgeAi.initialize() path; headless that needs shared_preferences'
  # in-memory mock store. The registration contract is tested in core.
  shared_preferences: ^2.5.2

# The native libraries are delivered as CodeAssets by hook/build.dart (Native
# Assets); this package OWNS the litertlm bundle. The macOS plugin carries no
# code: its Swift package brings the two companion libraries LiteRtLm needs as
# binary targets, so an app with Swift Package Manager on embeds them with no
# Podfile (#689). Its podspec only keeps an app with it off building.
flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
