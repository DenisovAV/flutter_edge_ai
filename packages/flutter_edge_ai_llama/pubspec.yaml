name: flutter_edge_ai_llama
description: Cross-platform GGUF inference and native EmbeddingGemma 2 text embeddings for Flutter Edge AI, powered by llamadart.
version: 0.0.1
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_llama

resolution: workspace
topics: [llm, gguf, on-device, inference]

platforms:
  android:
  ios:
  macos:
  windows:
  linux:
  web:

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai: ^2.5.0
  llamadart: '>=0.15.1 <0.15.2'

dev_dependencies:
  shared_preferences: ^2.5.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  web: ^1.1.1
  path_provider_platform_interface: ^2.1.2
