name: flutter_edge_ai_mediapipe
description: "MediaPipe (.task) on-device inference engine for flutter_edge_ai (Android/iOS/Web). Opt-in package; provides an InferenceEngineProvider. Bundles Google's MediaPipe Pod/Gradle deps."
version: 1.0.9
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_mediapipe
topics: [gemma, llm, mediapipe, on-device, ai]

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai: ^1.12.0
  mutex: ^3.1.0
  plugin_platform_interface: ^2.0.2
  # Direct import in the pigeon-generated lib/pigeon.g.dart (immutable, etc.).
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutterberlin.flutter_gemma_mediapipe
        pluginClass: FlutterEdgeAiMediaPipePlugin
      ios:
        pluginClass: FlutterEdgeAiMediaPipePlugin
