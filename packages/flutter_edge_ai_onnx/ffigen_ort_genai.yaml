name: OrtGenAiBindings
description: 'FFI bindings for ORT-GenAI C API (ort_genai_c.h v0.19.0)'
output: 'lib/src/ffi/ort_genai_bindings.g.dart'

headers:
  entry-points:
    - 'native/headers/ort_genai_c.h'
  include-directives:
    - 'native/headers/ort_genai_c.h'

compiler-opts:
  - '-I'
  - 'native/headers'
  # macOS arm64 target to resolve platform-specific branches in the header
  - '-D__APPLE__'
  - '-D__arm64__'

# ORT-GenAI exposes a flat set of C functions (unlike plain ORT's
# struct-of-function-pointers) — bind every `Oga*` entry point directly plus
# the opaque handle types they operate on.
functions:
  include:
    - 'Oga.*'

structs:
  include:
    - 'Oga.*'

typedefs:
  include:
    - 'Oga.*'

enums:
  include:
    - 'Oga.*'

silence-enum-warning: true

preamble: |
  // AUTO-GENERATED by ffigen — DO NOT EDIT.
  // Source: native/headers/ort_genai_c.h
  // ORT-GenAI version: 0.19.0
  // Header commit: d01b2441a72d4e3223415b9b08474c6e65fbc028 (microsoft/onnxruntime-genai tag v0.19.0)
  //
  // Key symbols bound: OgaCreateModel, OgaCreateGeneratorParams,
  // OgaGenerator_GenerateNextToken, OgaCreateTokenizer
  // ignore_for_file: unused_import
