name: flutter_edge_ai_qdrant
description: "qdrant-edge on-device vector-store provider for flutter_edge_ai_rag, via the official qdrant_edge UniFFI SDK. Native platforms only."
version: 1.4.0
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_qdrant
topics: [rag, qdrant, vector-search, embeddings, on-device]

# Native-only (qdrant-edge Rust FFI). Declared explicitly so the supported
# platform set is the package's own contract, not inferred from the transitive
# import graph. No web — use flutter_edge_ai_sqlite (WebSqliteVectorStore).
platforms:
  android:
  ios:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai_rag: ^1.0.0
  uuid: ^4.0.0
  # For the store's owned-subdir path handling (qdrant_edge_v1).
  path: ^1.9.0
  # Official Qdrant Edge Dart SDK (UniFFI binding of the shared qdrant-edge-ffi
  # crate). Keep the prerelease range below dev.5: dev.4 fixes native-memory
  # leaks, while a later prerelease may change the API or native archive.
  qdrant_edge: '>=0.8.0-dev.4 <0.8.0-dev.5'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No flutter: plugin/asset block — the native lib is delivered as a CodeAsset by
# the qdrant_edge SDK's Native Assets build hook, not a platform-channel plugin.
