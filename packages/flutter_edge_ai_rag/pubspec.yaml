name: flutter_edge_ai_rag
description: "Pluggable on-device RAG for Flutter Edge AI, with independent vector-store providers and embedders."
version: 1.1.1
resolution: workspace
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_rag
topics: [rag, vector-search, embeddings, on-device, ai]

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  # ^2.3.0: the embedder adapter calls `EmbeddingModel.embed` with
  # `EmbeddingInput` and `TaskType`, and the barrel re-exports the
  # `EmbeddingException` family — all new in 2.3.0.
  flutter_edge_ai: ^2.3.0
  # @visibleForTesting on FlutterEdgeAiActiveEmbedder's resolver seams.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # test/active_embedder_core_cache_test.dart drives core's real
  # getActiveEmbedder (install, cache, rebuild) on the host: core reads
  # SharedPreferences and path_provider, which the test fakes.
  path_provider_platform_interface: ^2.1.0
  shared_preferences: ^2.5.2
