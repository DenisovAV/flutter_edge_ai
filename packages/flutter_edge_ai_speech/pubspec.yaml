name: flutter_edge_ai_speech
description: "On-device speech (STT + TTS) for flutter_edge_ai via the LiteRT C API + dart:ffi. Opt-in Stt/TtsBackendProvider."
version: 0.5.3
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_speech
topics: [speech, stt, gemma, litert, on-device]

# 5 native platforms via dart:ffi (LiteRT C API, shared with flutter_edge_ai_litertlm).
# Web is declared but not yet implemented — the web arm of the conditional
# export throws UnsupportedError until the STT web pipeline lands (follow-on).
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # ^1.8.0, not ^1.5.6: this version reads `config.language` to pick Whisper's
  # output language, and the only thing that SETS it is core 1.8.0's
  # `getActiveStt(language:)`. On an older core it resolves, compiles and
  # transcribes — always in English — so the feature would be advertised and
  # silently inert.
  flutter_edge_ai: ^1.12.0
  # ^1.7.0: every tensor this package builds goes through litertlm's
  # LiteRtRankedTensorTypeView, and before 1.7.0 that view still used the MSVC
  # LiteRtLayout on Windows — STT/TTS failed there with status 3.
  flutter_edge_ai_litertlm: ^1.8.6
  ffi: ^2.1.0
  meta: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

# No flutter: plugin/asset block, no hook/build.dart of its own. The LiteRt
# interpreter FFI (LiteRtBindings) and the shared libLiteRtLm native bundle
# come transitively from flutter_edge_ai_litertlm, which owns the sole hook.
