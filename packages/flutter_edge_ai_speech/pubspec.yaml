name: flutter_edge_ai_speech
description: "On-device speech (STT + TTS) for flutter_edge_ai via the LiteRT C API + dart:ffi. Opt-in Stt/TtsBackendProvider."
version: 0.6.3
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_speech
topics: [speech, stt, gemma, litert, on-device]

# 5 native platforms via dart:ffi (LiteRT C API, from litertlm_dart's bundle, shared
# with flutter_edge_ai_litertlm).
# Web is declared but not yet implemented — the web arm of the conditional
# export throws UnsupportedError until the STT web pipeline lands (follow-on).
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # 2.5.5 brought the model catalog types (CatalogModel, SttVariant, TtsVariant).
  # (2.3.0 added `package:flutter_edge_ai/engine.dart`, which this imports.)
  # (1.8.0 was the older floor: this version reads `config.language` to pick
  # Whisper's output language, and only core 1.8.0's
  # `getActiveStt(language:)` sets it.)
  # 2.6.0 supplies the catalog and registry contracts used by this release.
  flutter_edge_ai: ^2.6.0
  # The LiteRT C API bindings (litert_bindings.dart) and the native bundle
  # that carries libLiteRt / libLiteRtLm.
  litertlm_dart: '>=0.20.0 <0.20.1'
  # LiteRtLmNpuTarget, the core NpuTarget the speech catalog names. 1.22.0 is
  # the first release on litertlm_dart 0.20.0; 1.21.x pin 0.19.1, which the
  # line above excludes. (The 1.20.x releases carry a build hook of their own,
  # which would bundle libLiteRtLm a second time.)
  flutter_edge_ai_litertlm: ^1.22.0
  ffi: ^2.1.0
  # The bundled VAD model is copied to the app's support directory for
  # LiteRT, which opens models by path, and checked against its SHA-256.
  crypto: ^3.0.6
  path_provider: ^2.1.4
  meta: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

# No flutter: plugin block and no hook/build.dart of its own. The LiteRt
# interpreter FFI (LiteRtBindings) and the shared libLiteRtLm native bundle
# come from litertlm_dart, which owns the sole hook. The one asset is the
# Silero VAD model VoiceActivityDetector uses by default (1.25 MB, MIT; see
# assets/vad/README.md).
flutter:
  assets:
    - assets/vad/silero_vad_16k_v6.3.tflite
