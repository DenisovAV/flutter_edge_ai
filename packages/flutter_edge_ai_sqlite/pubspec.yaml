name: flutter_edge_ai_sqlite
description: "SQLite vector search (sqlite-vec) provider for flutter_edge_ai_rag across native platforms and web."
version: 2.0.0
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/flutter_edge_ai_sqlite
topics: [rag, sqlite, vector-search, embeddings, web]

# All six platforms: native (sqlite3 + sqlite-vec/vec0 via dart:ffi) and web
# (sqlite-vec/vec0 statically linked into a custom sqlite3.wasm, driven through
# package:sqlite3/wasm.dart). Declared explicitly so the supported set is the
# package's own contract, not inferred from the transitive import graph.
platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'
  # 3.47.0, higher than the rest of this repo, and deliberately so. sqlite3
  # 3.6.0 is the first release whose `IndexedDbFileSystem.flush()` awaits an
  # in-flight write batch, and it needs hooks ^2.2.0 -> record_use -> meta
  # ^1.19.0, which Flutter 3.44.x pins to 1.18.0 exactly. Rather than ship a
  # version of this package whose `flush()` can return over unwritten pages,
  # no flutter_edge_ai_sqlite release supports 3.44 (1.4.0 already required
  # 3.47). An app on 3.44 has to stay on flutter_gemma_rag_sqlite 1.3.2, whose
  # README and CHANGELOG describe that limitation.
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai_rag: ^1.0.0
  sqlite3: ^3.6.0
  # Web Locks provide one exclusive lifetime lease per persistent database
  # location across tabs and workers. Web initialization fails closed when the
  # API is unavailable because a process-local lock cannot protect other tabs.
  web: ^1.1.1
  # Native Assets hook deps — hook/build.dart fetches the per-platform
  # sqlite-vec (vec0) loadable extension from the native-sqlite-vec-v* GitHub
  # Release and registers it as a CodeAsset resolved by DynamicLibrary.open.
  # `crypto` verifies the published SHA256 before the archive is extracted.
  hooks: ^2.0.0
  code_assets: ^1.2.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only helper for locating Native Assets on host `flutter test` runs.
  # The published provider graph has no direct dependency on core.
  flutter_edge_ai:
    path: ../flutter_edge_ai
  # tool/bench_vector_stores.dart benchmarks the vec0 store against qdrant in
  # the same harness; dev-only, never exported from lib/ (the published package
  # has no qdrant dependency). Path-pinned to the workspace sibling.
  flutter_edge_ai_qdrant:
    path: ../flutter_edge_ai_qdrant

# No `flutter:` plugin block. This package has NO hand-written native code and
# NO web platform-channel class. On native, sqlite3 is a normal pub dep and the
# vec0 loadable extension comes from the Native Assets hook above. On web, the
# custom sqlite3.wasm (sqlite-vec/vec0 linked in) ships as the package web asset
# `web/rag/sqlite3.wasm`; the consuming app copies it to its own web root (next
# to index.html, at `rag/sqlite3.wasm`) so WasmSqlite3.loadFromUrl can fetch it
# — there is no wa-sqlite CDN <script> and no index.html wiring anymore.
