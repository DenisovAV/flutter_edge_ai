name: genkit_flutter_edge_ai
description: Genkit Dart plugin for flutter_edge_ai — on-device LLM inference (Gemma, Qwen, Phi, DeepSeek, and more) with streaming, tools, JSON output, and embeddings.
version: 0.7.1
homepage: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/genkit_flutter_edge_ai
repository: https://github.com/DenisovAV/flutter_edge_ai
issue_tracker: https://github.com/DenisovAV/flutter_edge_ai/issues
topics:
  - genkit
  - flutter-edge-ai
  - llm
  - on-device-ai
  - embeddings

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  genkit: ^0.16.0
  flutter_edge_ai: ^2.1.0
  http: ^1.2.0
  schemantic: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  # Since schemantic 0.2 its generator is a separate package.
  schemantic_builder: ^0.1.3
  flutter_lints: ^6.0.0
