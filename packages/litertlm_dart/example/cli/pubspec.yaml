name: litertlm_chat
description: One prompt to a .litertlm model on the CPU, from a plain Dart program.
publish_to: none

# Not a member of the repository's pub workspace: the define below is read
# from the root of the resolution, and in the workspace root it would turn the
# Flutter example's macOS build into a plain Dart one.
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  litertlm_dart:
    path: ../..

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Outside Flutter, LiteRT-LM's macOS companion library has to be a code asset
# of the program (see litertlm_dart's README, "Where it runs today"). Linux
# and Windows ignore it.
hooks:
  user_defines:
    litertlm_dart:
      macos_companions: code_assets
