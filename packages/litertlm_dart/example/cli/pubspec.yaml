name: litertlm_chat
description: One prompt to a .litertlm model, on the CPU, GPU or NPU, from a plain Dart program.
publish_to: none

# Not a member of the repository's pub workspace: a plain Dart program,
# resolved on its own as a user's would be. It needs no hooks define on any
# platform (from litertlm_dart 0.20.0).
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  litertlm_dart:
    path: ../..

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
