name: litertlm_dart
description: "LiteRT-LM in pure Dart, no Flutter dependency: dart:ffi bindings, patched native builds fetched by a build hook, open sessions with rewind, NPU stacks and EmbeddingGemma 2."
# The upstream LiteRT-LM version this is built from, plus a build number for
# each of our native rebuilds of it: 0.19.1+1 is LiteRT-LM 0.19.1 on
# native-v0.19.1-c. Breaking Dart API changes ride an upstream version change.
version: 0.19.1+1
homepage: https://flutteredge.ai
repository: https://github.com/DenisovAV/flutter_edge_ai/tree/main/packages/litertlm_dart
topics: [litert, llm, ffi, on-device, gemma]

# Native only: the runtime is dart:ffi over libLiteRtLm. The web engine lives
# in flutter_edge_ai_litertlm.
platforms:
  android:
  ios:
  macos:
  windows:
  linux:

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  code_assets: ">=1.2.0 <3.0.0"
  crypto: ^3.0.6
  ffi: ^2.1.0
  hooks: ^2.0.0
  meta: ^1.16.0
  mutex: ^3.1.0
  yaml: ^3.1.0

dev_dependencies:
  # The member golden (test/public_surface/) resolves the public library
  # with the analyzer; the range is flutter_edge_ai's.
  analyzer: '>=13.0.0 <15.0.0'
  lints: ^6.0.0
  test: ^1.25.0
