name: plain_dart_check
description: CI check that litertlm_dart loads in a plain Dart program, built or run.
publish_to: none

# Not a member of the repository's pub workspace: a plain Dart program,
# resolved on its own as a user's would be. It sets no hooks define: from
# litertlm_dart 0.20.0 none is needed on any platform.
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  ffi: ^2.1.0
  litertlm_dart:
    path: ../..

dev_dependencies:
  lints: ^6.0.0
