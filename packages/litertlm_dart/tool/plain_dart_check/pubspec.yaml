name: plain_dart_check
description: CI check that litertlm_dart loads in a plain Dart program, built or run.
publish_to: none

# Not a member of the repository's pub workspace, for the same reason as
# example/cli: the define below must not reach the Flutter example.
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  litertlm_dart:
    path: ../..

dev_dependencies:
  lints: ^6.0.0

hooks:
  user_defines:
    litertlm_dart:
      macos_companions: code_assets
