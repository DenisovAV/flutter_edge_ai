name: flutter_edge_ai_workspace
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

# Native Dart pub workspace (Dart 3.6+). Each member opts in with
# `resolution: workspace` in its own pubspec.yaml.
workspace:
  # Motormind app (created with `flutter create`, see docs/SETUP.md §6):
  - apps/motormind
  # The pure-Dart packages under apps/motormind/packages are deliberately NOT
  # members; they resolve alone so `dart test` needs no Flutter (ADR 0005).
  - packages/flutter_edge_ai
  - packages/flutter_edge_ai_sqlite
  - packages/flutter_edge_ai_qdrant
  - packages/flutter_edge_ai_litertlm
  - packages/flutter_edge_ai_embeddings
  - packages/flutter_edge_ai_speech
  - packages/flutter_edge_ai_diagnostics
  - packages/flutter_edge_ai_mediapipe
  - packages/flutter_edge_ai_builtin_ai
  - packages/flutter_edge_ai_onnx
  - packages/flutter_edge_ai_agent
  - packages/genkit_flutter_edge_ai
  - packages/genkit_hybrid

dev_dependencies:
  melos: ^7.0.0

# Melos 7.x reads its configuration from this `melos:` section of the root
# pubspec.yaml (there is no standalone melos.yaml in melos 7). The package list
# comes from the top-level `workspace:` key above.
melos:
  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      run: melos exec -- "flutter analyze"
      description: Analyze every package.
    test:
      run: melos exec --dir-exists=test -- "flutter test"
      description: Unit-test every package that has a test/ dir.
    test_dart:
      run: melos exec --dir-exists=test --no-flutter -- "dart test"
      description: Unit-test pure-Dart packages (no Flutter dependency).
