# Static checks for the agent skills shipped inside packages/flutter_edge_ai.
#
# Division of labour: tool/check_skills.dart proves the CODE in the skills
# compiles against the real packages; this proves the FILES are well formed —
# frontmatter the Agent Skills spec allows, a name that matches its directory,
# a description inside the 1024-character budget, and every relative link
# resolving to a file that exists.
#
# Three rules are disabled upstream by default and are errors here:
#   check-relative-paths      the skills link to references/platform-setup.md
#                             and to each other; a moved file has to fail the
#                             build rather than hand an agent a dead pointer.
#   disallowed-field          the spec's reference validator rejects any
#                             frontmatter key outside its allowlist, and these
#                             skills install into eight different agents.
#   check-trailing-whitespace two trailing spaces are a markdown line break,
#                             which changes how an agent reads the line.
skills_lint:
  directories:
    - path: "packages/flutter_edge_ai/skills"
      rules:
        check-relative-paths: error
        check-absolute-paths: error
        disallowed-field: error
        check-trailing-whitespace: error
