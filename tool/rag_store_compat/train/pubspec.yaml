name: rag_store_compat_train
description: >-
  RAG store compatibility harness, TRAIN side: this checkout's
  flutter_edge_ai_rag / flutter_edge_ai_sqlite / flutter_edge_ai_qdrant. Writes
  the stores the published side must refuse, and verifies afterwards that
  nothing the published side tried changed them. Not a workspace member; see
  ../README.md.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai_rag: any
  flutter_edge_ai_sqlite: any
  flutter_edge_ai_qdrant: any
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# The workspace packages reach each other by version, so every one of them is
# overridden to this checkout (the train's versions are not on pub.dev yet).
dependency_overrides:
  flutter_edge_ai:
    path: ../../../packages/flutter_edge_ai
  flutter_edge_ai_rag:
    path: ../../../packages/flutter_edge_ai_rag
  flutter_edge_ai_sqlite:
    path: ../../../packages/flutter_edge_ai_sqlite
  flutter_edge_ai_qdrant:
    path: ../../../packages/flutter_edge_ai_qdrant
