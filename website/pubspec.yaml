name: fluttergemma_website
description: Marketing and documentation website for the flutter_edge_ai plugin.
version: 0.0.1
publish_to: none
# Deliberately NOT a member of the root `workspace:` list — keeps jaspr +
# embedded-flutter deps out of the 6 published packages' pub graph / pana.

environment:
  sdk: ^3.13.0

dependencies:
  # Exact while jaspr 0.24 is in beta: a caret on a prerelease takes any later
  # beta, which the CI's pinned jaspr_cli was not run against.
  jaspr: 0.24.0-beta.1
  jaspr_content: 0.6.0-beta.0
  jaspr_router: 0.10.0-beta.1
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: 0.24.0-beta.1
  lints: ^5.0.0

jaspr:
  mode: static
